<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prima — Constraint Field</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #08080c;
    color: #f5f5f7;
    font-family: 'Inter', -apple-system, sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }
  canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 4rem;
  }
  .label {
    font-weight: 200;
    font-size: clamp(2rem, 5vw, 3.5rem);
    letter-spacing: -0.03em;
    opacity: 0.55;
    transition: opacity 0.3s;
    max-width: 28rem;
    line-height: 1.15;
  }
  .label span.as { color: #5a7aff; }
  .label span.na { color: #e06a3a; }
  .legend {
    margin-top: 1.5rem;
    display: flex;
    gap: 1.5rem;
    font-size: 0.75rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    opacity: 0.25;
  }
  .legend .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .legend .dot.b { background: #5a7aff; box-shadow: 0 0 6px #5a7aff; }
  .legend .dot.o { background: #e06a3a; }
  .legend .dot.g { background: #f5c451; box-shadow: 0 0 6px #f5c451; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
  <div class="label" id="label">where the <span class="as">arrow</span> rests,<br>the field becomes <span class="na">territory</span></div>
  <div class="legend">
    <div><span class="dot b"></span> as — connected</div>
    <div><span class="dot o"></span> not_as — isolated</div>
    <div><span class="dot g"></span> frontier</div>
  </div>
</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2);

let W, H;
let cols, rows, spacing;
let nodes = [];
let mx = -999, my = -999, smx = -999, smy = -999;
let t = 0;
let radius = 180; // constraint radius — mouse's influence sphere

function init() {
  W = window.innerWidth;
  H = window.innerHeight;
  c.width = W * DPR;
  c.height = H * DPR;
  c.style.width = W + 'px';
  c.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  spacing = 28;
  cols = Math.floor(W / spacing) + 1;
  rows = Math.floor(H / spacing) + 1;

  nodes = [];
  for (let r = 0; r < rows; r++) {
    nodes[r] = [];
    for (let c = 0; c < cols; c++) {
      nodes[r][c] = {
        x: c * spacing + (r % 2 === 0 ? 0 : spacing * 0.5),
        y: r * spacing,
        strength: 0,   // 0 = not_as, 1 = as
        pulse: Math.random() * Math.PI * 2,
        base: Math.random() * 0.3,
      };
    }
  }
}

function dist(x1, y1, x2, y2) {
  return Math.hypot(x2 - x1, y2 - y1);
}

function smoothstep(edge0, edge1, x) {
  const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

function draw() {
  requestAnimationFrame(draw);
  t += 0.016;

  // Smooth mouse follow
  smx += (mx - smx) * 0.08;
  smy += (my - smy) * 0.08;

  // Breathing radius
  const breathe = 1 + Math.sin(t * 0.7) * 0.1 + Math.sin(t * 1.3) * 0.05;
  const effRadius = radius * breathe;

  // Update node strengths based on mouse proximity
  const innerR = effRadius * 0.55;
  const outerR = effRadius;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const n = nodes[r][c];
      const d = dist(smx, smy, n.x, n.y);

      let target;
      if (d < innerR) {
        target = 1.0;
      } else if (d < outerR) {
        target = 1.0 - smoothstep(innerR, outerR, d);
      } else {
        // Farther away: ambient low-strength with noise
        target = n.base * 0.25 + Math.sin(n.pulse + t * 0.4) * 0.05;
        target = Math.max(0, target);
      }

      n.strength += (target - n.strength) * 0.12;

      // Subtle wobble for isolated nodes
      if (n.strength < 0.2) {
        n.y += Math.sin(n.pulse + t * 1.5) * 0.15;
      }
    }
  }

  // Clear
  ctx.fillStyle = '#08080c';
  ctx.fillRect(0, 0, W, H);

  // Draw connections first (behind nodes)
  for (let r = 0; r < rows - 1; r++) {
    for (let c = 0; c < cols - 1; c++) {
      const n1 = nodes[r][c];
      const n2 = nodes[r][c + 1];
      const n3 = nodes[r + 1][c];
      const n4 = nodes[r + 1][c + 1];

      // Horizontal connection
      if (n1.strength > 0.15 && n2.strength > 0.15) {
        const alpha = Math.min(n1.strength, n2.strength) * 0.18;
        ctx.strokeStyle = `rgba(90,122,255,${alpha})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(n1.x, n1.y);
        ctx.lineTo(n2.x, n2.y);
        ctx.stroke();
      }

      // Vertical connection
      if (n1.strength > 0.15 && n3.strength > 0.15) {
        const alpha = Math.min(n1.strength, n3.strength) * 0.18;
        ctx.strokeStyle = `rgba(90,122,255,${alpha})`;
        ctx.beginPath();
        ctx.moveTo(n1.x, n1.y);
        ctx.lineTo(n3.x, n3.y);
        ctx.stroke();
      }
    }
  }

  // Draw nodes
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const n = nodes[r][c];
      if (n.strength < 0.02) continue;

      const x = n.x, y = n.y;

      if (n.strength > 0.5) {
        // Connected node (as) — blue with glow
        const glow = n.strength;
        ctx.beginPath();
        ctx.arc(x, y, 1.8, 0, Math.PI * 2);

        // Outer glow
        const g1 = ctx.createRadialGradient(x, y, 0, x, y, 4.5);
        g1.addColorStop(0, `rgba(90,122,255,${glow * 0.7})`);
        g1.addColorStop(0.5, `rgba(90,122,255,${glow * 0.15})`);
        g1.addColorStop(1, 'rgba(90,122,255,0)');
        ctx.fillStyle = g1;
        ctx.fill();

        // Core
        ctx.beginPath();
        ctx.arc(x, y, 1.2, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(90,122,255,${0.3 + glow * 0.5})`;
        ctx.fill();

      } else if (n.strength > 0.2) {
        // Frontier zone — gold
        const glow = n.strength;
        ctx.beginPath();
        ctx.arc(x, y, 1.2, 0, Math.PI * 2);
        const g2 = ctx.createRadialGradient(x, y, 0, x, y, 3);
        g2.addColorStop(0, `rgba(245,196,81,${glow * 0.5})`);
        g2.addColorStop(1, 'rgba(245,196,81,0)');
        ctx.fillStyle = g2;
        ctx.fill();

      } else {
        // Isolated node (not_as) — muted orange, no glow
        ctx.beginPath();
        ctx.arc(x, y, 1.0, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(224,106,58,${0.15 + n.strength * 0.3})`;
        ctx.fill();
      }
    }
  }

  // Mouse cursor ghost ring
  if (smx > 0 && smy > 0) {
    const pulse = 0.3 + Math.sin(t * 2) * 0.1;
    ctx.beginPath();
    ctx.arc(smx, smy, innerR, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(90,122,255,${pulse * 0.12})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(smx, smy, outerR, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(224,106,58,${pulse * 0.06})`;
    ctx.stroke();
  }

  // Update label opacity
  const label = document.getElementById('label');
  if (smx > 0 && smy > 0) {
    label.style.opacity = '0.45';
  } else {
    label.style.opacity = '0.7';
  }
}

window.addEventListener('mousemove', (e) => {
  mx = e.clientX;
  my = e.clientY;
});

window.addEventListener('touchmove', (e) => {
  mx = e.touches[0].clientX;
  my = e.touches[0].clientY;
});

window.addEventListener('mouseleave', () => {
  mx = -999;
  my = -999;
});

window.addEventListener('resize', init);

init();
draw();
</script>
</body>
</html>
