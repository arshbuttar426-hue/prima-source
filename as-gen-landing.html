<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>as / not_as — generative</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
  canvas { position: fixed; top: 0; left: 0; z-index: 0; }
  .overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 10; pointer-events: none; padding: 40px;
  }
  h1 { font-size: 4rem; font-weight: 200; letter-spacing: -3px; line-height: 1;
    color: rgba(255,255,255,0.9); margin-bottom: 16px; text-align: center; }
  h1 .as { color: #5a7aff; }
  h1 .na { color: #e06a3a; }
  p { font-size: 1rem; color: rgba(255,255,255,0.3); font-weight: 300; max-width: 500px; text-align: center; }
  .pipeline-viz {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 6px; align-items: center;
    background: rgba(0,0,0,0.4); backdrop-filter: blur(10px);
    padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05);
  }
  .pv { font-size: 0.7rem; font-family: 'SF Mono', monospace; padding: 3px 8px; border-radius: 4px; }
  .pv.na { background: rgba(224,106,58,0.15); color: #e06a3a; }
  .pv.as { color: #5a7aff; font-weight: 700; padding: 3px 4px; }
  .pv.res { color: rgba(255,255,255,0.5); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
  <h1><span class="as">as</span> / <span class="na">not_as</span></h1>
  <p>Every frame is a pipeline. Move your mouse to change the input. The architecture produces the visual.</p>
</div>
<div class="pipeline-viz" id="viz">
  <span class="pv na">sin(x)</span><span class="pv as">+</span>
  <span class="pv na">cos(y)</span><span class="pv as">−</span>
  <span class="pv na">dist(m)</span><span class="pv as">+</span>
  <span class="pv na">noise(t)</span><span class="pv as">=</span>
  <span class="pv res" id="liveVal">0</span>
</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H, mx = 0, my = 0, t = 0;

function resize() { W = c.width = window.innerWidth; H = c.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

function sinX(x, y, time) { return Math.sin(x * 0.01 + time * 0.5) * 200 + H / 2; }
function cosY(x, y, time) { return Math.cos(y * 0.01 + time * 0.3) * 200 + W / 2; }
function distM(x, y, time) { const dx = mx - x; const dy = my - y; return Math.sqrt(dx * dx + dy * dy); }
function noiseT(x, y, time) { return (Math.sin(x * 0.02 + time) * Math.cos(y * 0.02 + time * 0.7) + 1) * 100; }

function pipeline(x, y, time) {
  return sinX(x, y, time) + cosY(x, y, time) - distM(x, y, time) + noiseT(x, y, time);
}

function draw() {
  t += 0.016;
  ctx.fillStyle = 'rgba(10, 10, 15, 0.15)';
  ctx.fillRect(0, 0, W, H);

  const spacing = 28;
  const cols = Math.ceil(W / spacing);
  const rows = Math.ceil(H / spacing);

  for (let i = 0; i < cols; i++) {
    for (let j = 0; j < rows; j++) {
      const x = i * spacing + spacing / 2;
      const y = j * spacing + spacing / 2;
      const val = pipeline(x, y, t);
      const norm = (val + 400) / 800;
      const clamped = Math.max(0, Math.min(1, norm));

      const alpha = 0.15 + clamped * 0.35;
      const hue = 220 + clamped * 30;
      const size = 1.5 + clamped * 4;

      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue}, 50%, 60%, ${alpha})`;
      ctx.fill();
    }
  }

  const liveX = W / 2;
  const liveY = H / 2;
  const liveVal = pipeline(liveX, liveY, t);
  document.getElementById('liveVal').textContent = Math.round(liveVal);

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
