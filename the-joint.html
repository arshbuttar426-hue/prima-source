<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Joint - as/not_as Architecture Demo</title>
<style>
* {margin:0;padding:0;box-sizing:border-box}
body{background:#08080c;color:#0f0;font-family:monospace;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
h1{font-size:1.5rem;letter-spacing:2px}
.grid{display:grid;grid-template-columns:repeat(5,60px);gap:10px}
.cell{width:60px;height:60px;background:#08080c;border:1px solid #0f0;display:flex;align-items:center;justify-content:center;cursor:user-select;font-weight:bold}
.conn{width:10px;height:10px;background:#0f0;border-radius:50%;margin:0 5px}
.info{font-size:0.8rem;color:#555;max-width:400px;text-align:center}
</style>
</head>
<body>
<h1>THE JOINT</h1>
<div class="as-not-as">
<div>● = as (position, no value)</div>
<div>■ = not_as (computes value)</div>
</div>
<div class="grid" id="grid"></div>
<div class="info">
Click cells to toggle state (not_as)<br>
Click connections to toggle influence (as)<br>
Pattern emerges purely from as/not_as arrangement
</div>
<script>
const GRID_SIZE=5;
let cells=Array(GRID_SIZE).fill(0); // not_as states (0/1)
let conns=Array(GRID_SIZE-1).fill(1); // as connections (1=connected, 0=isolated)

function updateDisplay(){
document.getElementById('grid').innerHTML='';
for(let i=0;i<GRID_SIZE;i++){
const cell=document.createElement('div');
cell.className='cell';
cell.textContent=cells[i];
cell.onclick=()=>{cells[i]=1-cells[i];updateDisplay()};
document.getElementById('grid').appendChild(cell);
if(i<GRID_SIZE-1){
const conn=document.createElement('div');
conn.className='conn';
conn.onclick=()=>{conns[i]=1-conns[i];updateDisplay()};
document.getElementById('grid').appendChild(conn);
}
}
}
function step(){
const next=cells.slice();
for(let i=0;i<GRID_SIZE;i++){
let sum=0;
if(i>0 && conns[i-1]) sum+=cells[i-1];
if(i<GRID_SIZE-1 && conns[i]) sum+=cells[i+1];
next[i]=sum>0 ? 1-cell[i] : cell[i]; // Toggle if neighbor active
}
cells=next;
updateDisplay();
}
setInterval(step,500);
updateDisplay();
</script>
</body>
</html>
