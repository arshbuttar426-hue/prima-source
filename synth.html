<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>as/not_as synthesizer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0806; font-family: 'Share Tech Mono', monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; user-select: none; }
  .scope-panel { flex: 1; min-height: 200px; background: #060504; border-bottom: 1px solid rgba(180,120,40,0.1); position: relative; }
  .scope-panel canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .control-panel { padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; background: linear-gradient(180deg, #0e0c08 0%, #0a0806 100%); }
  .module { padding: 14px; background: rgba(20,16,10,0.5); border: 1px solid rgba(120,80,30,0.12); border-radius: 6px; min-width: 180px; }
  .module .title { font-size: 0.52rem; letter-spacing: 0.22em; color: rgba(160,110,30,0.45); text-transform: uppercase; margin-bottom: 10px; }
  .osc-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .osc-btn { padding: 7px 12px; background: rgba(30,20,10,0.5); border: 1px solid rgba(100,70,20,0.2); color: rgba(140,100,30,0.5); font-family: 'Share Tech Mono', monospace; font-size: 0.58rem; letter-spacing: 0.1em; cursor: pointer; text-transform: uppercase; border-radius: 3px; transition: all 0.1s; }
  .osc-btn:hover { border-color: rgba(160,110,30,0.3); color: rgba(180,130,30,0.7); }
  .osc-btn.on { background: rgba(180,120,40,0.12); border-color: rgba(180,120,40,0.4); color: #c49830; }
  .osc-btn.neg { background: rgba(180,60,40,0.12); border-color: rgba(180,60,40,0.4); color: #c46040; }
  .key-row { display: flex; gap: 2px; justify-content: center; flex-wrap: wrap; }
  .key { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: rgba(30,20,10,0.4); border: 1px solid rgba(100,70,20,0.15); color: rgba(140,100,30,0.4); font-family: 'Share Tech Mono', monospace; font-size: 0.52rem; border-radius: 2px; cursor: pointer; transition: all 0.04s; }
  .key:active, .key.down { background: rgba(180,120,40,0.18); border-color: rgba(180,120,40,0.45); color: #d4a030; }
  .pipeline-bar { padding: 6px 20px; background: #060504; display: flex; align-items: center; justify-content: center; gap: 5px; flex-wrap: wrap; font-size: 0.52rem; border-top: 1px solid rgba(180,120,40,0.05); }
  .pipeline-bar span { padding: 2px 7px; border-radius: 2px; }
  .pl-as { color: #5a7aff; background: rgba(90,122,255,0.08); font-weight: 600; }
  .pl-na { color: #e06a3a; background: rgba(224,106,58,0.08); }
  .pl-res { color: rgba(200,200,200,0.5); }
  .status-bar { padding: 4px 20px; background: #060504; display: flex; align-items: center; gap: 12px; font-size: 0.52rem; color: rgba(120,80,30,0.4); border-top: 1px solid rgba(180,120,40,0.04); }
  .status-dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(180,120,40,0.6); animation: dotPulse 1s ease-in-out infinite; }
  @keyframes dotPulse { 0%,100%{opacity:0.3} 50%{opacity:1} }
  @media (max-width: 700px) { .key { width: 26px; height: 26px; font-size: 0.45rem; } }
</style>
</head>
<body>
<div class="scope-panel"><canvas id="scope"></canvas></div>

<div class="control-panel">
  <div class="module">
    <div class="title">not_as // oscillators</div>
    <div class="osc-row">
      <button class="osc-btn on" data-osc="sine">sine</button>
      <button class="osc-btn" data-osc="saw">saw</button>
      <button class="osc-btn neg" data-osc="square">square (−)</button>
      <button class="osc-btn" data-osc="tri">tri</button>
    </div>
  </div>
  <div class="module">
    <div class="title">as // connection type</div>
    <div class="osc-row" style="font-size:0.55rem;color:rgba(140,100,30,0.5);">
      <span>sine/tri → +1 gain</span><br>
      <span>saw → +1 gain</span><br>
      <span>square → −1 gain</span>
    </div>
  </div>
  <div class="module">
    <div class="title">play // keys</div>
    <div class="key-row" id="keyboard"></div>
  </div>
</div>

<div class="pipeline-bar" id="pipeline"></div>
<div class="status-bar">
  <span class="status-dot"></span> sample rate: <span id="sr">—</span>
  &middot; playing: <span id="playing">no</span>
  &middot; osc active: <span id="oscCount">—</span>
</div>

<script>
const scope = document.getElementById('scope');
const scopeCtx = scope.getContext('2d');
let SW, SH;
function rz() { SW=scope.width=scope.parentElement.clientWidth; SH=scope.height=scope.parentElement.clientHeight; }
window.addEventListener('resize',rz); rz();

let audioCtx, masterGain, filterNode, analyser, audioReady=false;
let activeFreq=0, oscNodes={};
const oscStates={sine:true,saw:false,square:false,tri:false};

const noteMap={};
[['q','2','w','3','e','r','5','t','6','y','7','u'],['z','s','x','d','c','v','g','b','h','n','j','m']]
.forEach((row,ri)=>{row.forEach((k,i)=>{noteMap[k]=[261.63,329.63][ri]*Math.pow(2,i/12)})});

function buildSynth(){
  oscNodes={};
  [{name:'sine',type:'sine',sign:1},{name:'saw',type:'sawtooth',sign:1},{name:'square',type:'square',sign:-1},{name:'tri',type:'triangle',sign:1}]
  .forEach(t=>{
    const o=audioCtx.createOscillator(); o.type=t.type; o.frequency.setValueAtTime(0,audioCtx.currentTime);
    const g=audioCtx.createGain(); g.gain.setValueAtTime(0,audioCtx.currentTime);
    o.connect(g); g.connect(filterNode); o.start();
    oscNodes[t.name]={osc:o,gain:g,sign:t.sign};
  });
  updateOscGains(); updateOscFreqs();
}

function updateOscGains(){
  if(!audioReady)return;
  const n=audioCtx.currentTime;
  let c=0;
  for(const[name,state]of Object.entries(oscStates)){
    const nd=oscNodes[name];
    if(nd){nd.gain.gain.setValueAtTime(state?nd.sign*0.22:0,n); if(state)c++;}
  }
  document.getElementById('oscCount').textContent=c;
}

function updateOscFreqs(){
  if(!audioReady)return;
  const n=audioCtx.currentTime;
  for(const[name,state]of Object.entries(oscStates)){
    const nd=oscNodes[name];
    if(nd)nd.osc.frequency.setValueAtTime(state?activeFreq:0,n);
  }
}

async function initAudio(){
  if(audioReady)return true;
  try{
    audioCtx=new AudioContext();
    if(audioCtx.state==='suspended')await audioCtx.resume();
    document.getElementById('sr').textContent=audioCtx.sampleRate+' Hz';

    filterNode=audioCtx.createBiquadFilter();
    filterNode.type='lowpass';
    filterNode.frequency.setValueAtTime(8000,audioCtx.currentTime);
    filterNode.Q.setValueAtTime(0.5,audioCtx.currentTime);

    masterGain=audioCtx.createGain();
    masterGain.gain.setValueAtTime(0,audioCtx.currentTime);

    analyser=audioCtx.createAnalyser();
    analyser.fftSize=2048;

    buildSynth();
    filterNode.connect(masterGain);
    masterGain.connect(analyser);
    analyser.connect(audioCtx.destination);

    audioReady=true;
    document.getElementById('pipeline').style.opacity='1';
    return true;
  }catch(e){
    console.error('audio init failed:',e);
    document.getElementById('sr').textContent='ERROR: '+e.message;
    return false;
  }
}

function setNote(freq,on){
  if(!audioReady)return;
  const n=audioCtx.currentTime;
  if(on){activeFreq=freq; updateOscFreqs(); masterGain.gain.setValueAtTime(0.55,n);}
  else{activeFreq=0; masterGain.gain.setValueAtTime(0,n);}
  document.getElementById('playing').textContent=on?'yes':'no';
}

document.getElementById('keyboard').innerHTML=Object.entries(noteMap).map(([k,f])=>
  `<div class="key" data-k="${k}">${k.toUpperCase()}</div>`
).join('');

document.querySelectorAll('.key').forEach(k=>{
  k.addEventListener('mousedown',e=>{e.preventDefault(); initAudio().then(()=>setNote(noteMap[k.dataset.k],true)); k.classList.add('down')});
  k.addEventListener('mouseup',()=>{setNote(noteMap[k.dataset.k],false); k.classList.remove('down')});
  k.addEventListener('mouseleave',()=>{setNote(noteMap[k.dataset.k],false); k.classList.remove('down')});
});

document.addEventListener('keydown',e=>{
  if(e.repeat)return;
  const k=e.key.toLowerCase();
  if(noteMap[k]){initAudio().then(()=>{setNote(noteMap[k],true); document.querySelector(`.key[data-k="${k}"]`)?.classList.add('down')});}
  if(k>='1'&&k<='4')toggleOsc(parseInt(k)-1);
});
document.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(noteMap[k]){setNote(noteMap[k],false); document.querySelector(`.key[data-k="${k}"]`)?.classList.remove('down');}
});

function toggleOsc(i){
  const names=['sine','saw','square','tri'];
  oscStates[names[i]]=!oscStates[names[i]];
  const btn=document.querySelector(`.osc-btn[data-osc="${names[i]}"]`);
  if(btn)btn.classList.toggle('on',oscStates[names[i]]);
  updateOscGains(); updateOscFreqs(); updatePipeline();
}

document.querySelectorAll('.osc-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    initAudio();
    const name=btn.dataset.osc;
    oscStates[name]=!oscStates[name];
    btn.classList.toggle('on',oscStates[name]);
    updateOscGains(); updateOscFreqs(); updatePipeline();
  });
});

function updatePipeline(){
  const sig={sine:'+',saw:'+',square:'−',tri:'+'};
  const short={sine:'sin',saw:'saw',square:'sq',tri:'tri'};
  let p='';
  let first=true;
  for(const[name,state]of Object.entries(oscStates)){
    if(!state)continue;
    if(!first)p+=`<span class="pl-as">${sig[name]}</span>`;
    p+=`<span class="pl-na">${short[name]}</span>`;
    first=false;
  }
  p+='<span class="pl-as">→</span><span class="pl-na">filter</span><span class="pl-as">→</span><span class="pl-na">gate</span><span class="pl-res">= out</span>';
  document.getElementById('pipeline').innerHTML=p;
}
updatePipeline();

document.body.addEventListener('click',()=>initAudio());

// scope
const wd=new Uint8Array(2048);
function draw(){
  if(analyser)analyser.getByteTimeDomainData(wd);
  scopeCtx.clearRect(0,0,SW,SH);
  scopeCtx.strokeStyle='rgba(200,150,40,0.25)'; scopeCtx.lineWidth=1; scopeCtx.beginPath();
  const step=SW/wd.length;
  for(let i=0;i<wd.length;i++){const x=i*step,y=SH*(wd[i]/256); i===0?scopeCtx.moveTo(x,y):scopeCtx.lineTo(x,y);}
  scopeCtx.stroke();
  scopeCtx.strokeStyle='rgba(200,150,40,0.06)'; scopeCtx.lineWidth=0.5; scopeCtx.beginPath();
  scopeCtx.moveTo(0,SH*0.5); scopeCtx.lineTo(SW,SH*0.5); scopeCtx.stroke();
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
