<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — as/not_as</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#08080c; overflow:hidden; height:100vh; cursor:none; font-family:-apple-system,'SF Pro Display','Inter',sans-serif; }
  canvas { display:block; }
  .hud { position:fixed; top:40px; left:40px; z-index:2; display:flex; gap:40px; pointer-events:none; }
  .hud .stat { display:flex; flex-direction:column; gap:2px; }
  .hud .label { font-size:0.6rem; font-weight:500; letter-spacing:0.08em; color:rgba(255,255,255,0.2); text-transform:uppercase; }
  .hud .val { font-size:1.8rem; font-weight:200; letter-spacing:-0.02em; color:rgba(255,255,255,0.7); line-height:1; }
  .overlay { position:fixed; top:0;left:0;width:100%;height:100%;z-index:10; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.7); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); opacity:0; transition:opacity 0.6s; pointer-events:none; }
  .overlay.show { opacity:1; pointer-events:auto; }
  .overlay-inner { text-align:center; }
  .overlay h2 { font-size:1.8rem; font-weight:200; color:rgba(255,255,255,0.8); letter-spacing:-0.02em; margin-bottom:8px; }
  .overlay p { font-size:0.85rem; font-weight:300; color:rgba(255,255,255,0.3); margin-bottom:24px; }
  .overlay .btn { font-size:0.8rem; font-weight:400; padding:10px 32px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); color:rgba(255,255,255,0.7); border-radius:20px; cursor:pointer; letter-spacing:0.02em; transition:all 0.2s; }
  .overlay .btn:hover { background:rgba(255,255,255,0.14); color:#fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="stat"><span class="label">Score</span><span class="val" id="score">0</span></div>
  <div class="stat"><span class="label">Best</span><span class="val" id="best">0</span></div>
  <div class="stat"><span class="label">Length</span><span class="val" id="len">12</span></div>
</div>
<div class="overlay show" id="startOverlay">
  <div class="overlay-inner"><h2>Snake</h2><p>Move your cursor. Eat the light.</p><button class="btn" id="startBtn">Play</button></div>
</div>
<div class="overlay" id="gameOverOverlay">
  <div class="overlay-inner"><h2>Game Over</h2><p id="finalScore">Score: 0</p><button class="btn" id="retryBtn">Play Again</button></div>
</div>
<script>
// ─── canvas ───
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H; function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;} window.addEventListener('resize',resize); resize();

// ─── input state ───
let mx=W/2,my=H/2,pmx=mx,pmy=my;
document.addEventListener('mousemove',e=>{pmx=mx;pmy=my;mx=e.clientX;my=e.clientY});
document.addEventListener('touchmove',e=>{e.preventDefault();pmx=mx;pmy=my;mx=e.touches[0].clientX;my=e.touches[0].clientY},{passive:false});

// ═══════════════════════════════════════
// not_as: pure computation functions
// each receives state → returns a number
// ═══════════════════════════════════════

const not_as = {

  headDir: (mx,my,hx,hy)=>{
    const dx=mx-hx,dy=my-hy,d=Math.hypot(dx,dy)||1;
    return {x:dx/d,y:dy/d,d};
  },

  headMove: (hx,hy,dir,speed)=>{
    return {x:hx+dir.x*speed, y:hy+dir.y*speed};
  },

  segFollow: (lx,ly,sx,sy,gap)=>{
    const d=Math.hypot(lx-sx,ly-sy);
    if(d<=gap) return {x:sx,y:sy};
    const t=(d-gap)/d*0.65;
    return {x:sx+(lx-sx)*t, y:sy+(ly-sy)*t};
  },

  dist: (ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by),

  boundsDeath: (hx,hy,W,H)=>hx<0||hx>=W||hy<0||hy>=H?1:0,

  selfDeath: (head,body,startIdx,gap)=>{
    for(let i=startIdx;i<body.length;i++){
      if(not_as.dist(head.x,head.y,body[i].x,body[i].y)<gap*0.65) return 1;
    }
    return 0;
  },

  fruitEaten: (hx,hy,fx,fy)=>not_as.dist(hx,hy,fx,fy)<14?1:0,

  fruitLifeStep: (life)=>life-1,

  snakeGrow: (body,targetLen,head)=>{
    while(body.length<targetLen){
      const t=body[body.length-1]||head;
      body.push({x:t.x,y:t.y});
    }
    return body;
  },

  particleStep: (p)=>{
    p.x+=p.vx; p.y+=p.vy;
    p.vx*=0.96; p.vy*=0.96;
    p.life-=1;
    return p;
  },

  flashDecay: (a)=>a*0.88,
};

// ═══════════════════════════════════════
// game state
// ═══════════════════════════════════════
const state={
  snake:[], targetLen:12, segGap:8, speed:2.8,
  fruit:null, fruitLife:0, fruitMax:360,
  score:0, best:parseInt(localStorage.getItem('appleSnakeBest')||'0'),
  playing:false, dead:false,
  particles:[], flash:0, frame:0,
};

function initSnake(){
  state.snake=[];
  for(let i=0;i<12;i++)state.snake.push({x:W/2-i*state.segGap*0.5,y:H/2});
  state.targetLen=12;
}
initSnake();

function spawnFruit(){
  state.fruit={x:W*0.05+Math.random()*W*0.9,y:H*0.05+Math.random()*H*0.9};
  state.fruitLife=state.fruitMax;
}
spawnFruit();

function burst(x,y,n){
  state.flash=0.4;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=3+Math.random()*10;
    state.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:40+Math.random()*30,sz:1.5+Math.random()*3.5});
  }
}

// ═══════════════════════════════════════
// as pipeline: the game loop
// each line connects not_as outputs via +/−
// ═══════════════════════════════════════

function pipeline(){
  if(!state.playing||state.dead)return;
  state.frame++;

  // ── head: dir + move ──
  const smx=mx+(mx-pmx)*0.25, smy=my+(my-pmy)*0.25;
  const dir=not_as.headDir(smx,smy,state.snake[0].x,state.snake[0].y);
  const head=not_as.headMove(state.snake[0].x,state.snake[0].y,dir,state.speed);
  const newBody=[head];

  // ── body: each segment follows its leader ──
  for(let i=1;i<state.snake.length;i++){
    const ldr=newBody[i-1];
    const seg=not_as.segFollow(ldr.x,ldr.y,state.snake[i].x,state.snake[i].y,state.segGap);
    newBody.push(seg);
  }
  state.snake=newBody;

  // ── death: bounds + self = dead ──
  state.dead=!!(not_as.boundsDeath(head.x,head.y,W,H) + not_as.selfDeath(head,state.snake,7,state.segGap));

  // ── fruit: life step + eaten check ──
  state.fruitLife=not_as.fruitLifeStep(state.fruitLife);
  if(state.fruitLife<=0)spawnFruit();
  if(not_as.fruitEaten(head.x,head.y,state.fruit.x,state.fruit.y)){
    const bonus=Math.max(1,Math.floor(state.fruitLife/40));
    state.score+=bonus;
    state.targetLen+=5+bonus;
    burst(state.fruit.x,state.fruit.y,35+bonus*5);
    spawnFruit();
  }

  // ── grow: body + new segments ──
  state.snake=not_as.snakeGrow(state.snake,state.targetLen,head);
  if(state.snake.length>state.targetLen)state.snake.splice(state.targetLen);

  // ── particles: step each ──
  for(let i=state.particles.length-1;i>=0;i--){
    state.particles[i]=not_as.particleStep(state.particles[i]);
    if(state.particles[i].life<=0)state.particles.splice(i,1);
  }

  // ── flash: decay ──
  state.flash=not_as.flashDecay(state.flash);

  // ── score persist ──
  if(state.score>state.best){state.best=state.score;localStorage.setItem('appleSnakeBest',state.best);}
  document.getElementById('score').textContent=state.score;
  document.getElementById('best').textContent=state.best;
  document.getElementById('len').textContent=state.snake.length;
}

// ═══════════════════════════════════════
// ambient state
// ═══════════════════════════════════════
const ambient=[];
for(let i=0;i<40;i++)ambient.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*0.2,vy:-Math.random()*0.3-0.05,r:Math.random()*1.2+0.4,a:Math.random()*0.15+0.03});

function draw(){
  ctx.clearRect(0,0,W,H);

  for(const a of ambient){
    a.x+=a.vx; a.y+=a.vy;
    if(a.y<-10){a.y=H+10;a.x=Math.random()*W;} if(a.x<-10)a.x=W+10; if(a.x>W+10)a.x=-10;
    ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,Math.PI*2); ctx.fillStyle=`rgba(255,255,255,${a.a})`; ctx.fill();
  }

  if(!state.playing&&!state.dead)return;

  // fruit
  if(state.fruit&&!state.dead){
    const lf=state.fruitLife/state.fruitMax;
    const pulse=Math.sin(state.frame*0.08)*0.25+0.75;
    const alpha=lf<0.12?lf/0.12:1;
    const ox=state.fruit.x+Math.cos(state.frame*0.03)*3, oy=state.fruit.y+Math.sin(state.frame*0.04)*3;

    for(const a of ambient){const dx=ox-a.x,dy=oy-a.y,d=Math.hypot(dx,dy);if(d<200){a.vx+=dx/d*0.003;a.vy+=dy/d*0.003;a.vx*=0.995;a.vy*=0.995;}}

    const h3=ctx.createRadialGradient(ox,oy,8,ox,oy,60);
    h3.addColorStop(0,`rgba(255,180,60,${alpha*0.08})`);h3.addColorStop(0.5,`rgba(255,140,30,${alpha*0.03})`);h3.addColorStop(1,'rgba(255,100,20,0)');
    ctx.fillStyle=h3;ctx.beginPath();ctx.arc(ox,oy,60,0,Math.PI*2);ctx.fill();

    const h1=ctx.createRadialGradient(ox,oy,3,ox,oy,28);
    h1.addColorStop(0,`rgba(255,220,100,${alpha*0.25})`);h1.addColorStop(0.3,`rgba(255,180,60,${alpha*0.15})`);h1.addColorStop(0.7,`rgba(255,120,30,${alpha*0.05})`);h1.addColorStop(1,'rgba(255,80,20,0)');
    ctx.fillStyle=h1;ctx.beginPath();ctx.arc(ox,oy,28,0,Math.PI*2);ctx.fill();

    ctx.strokeStyle=`rgba(255,200,80,${alpha*(lf<0.3?0.6:0.35)})`;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(ox,oy,12+Math.sin(state.frame*0.12)*1.5,-Math.PI/2,-Math.PI/2+Math.PI*2*lf);ctx.stroke();
    ctx.strokeStyle=`rgba(255,255,200,${alpha*0.3})`;ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(ox,oy,8,-Math.PI/2,-Math.PI/2+Math.PI*2*lf*0.6);ctx.stroke();

    const core=ctx.createRadialGradient(ox-1.5,oy-1.5,0,ox,oy,6);
    core.addColorStop(0,`rgba(255,255,240,${alpha*pulse})`);core.addColorStop(0.3,`rgba(255,220,100,${alpha*0.9})`);core.addColorStop(0.7,`rgba(255,140,40,${alpha*0.5})`);core.addColorStop(1,`rgba(200,80,20,${alpha*0.2})`);
    ctx.fillStyle=core;ctx.beginPath();ctx.arc(ox,oy,6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=`rgba(255,255,255,${alpha*0.7})`;ctx.beginPath();ctx.arc(ox-1.5,oy-2,1.8,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(ox-0.5,oy-2.5,0.7,0,Math.PI*2);ctx.fill();
  }

  // particles
  for(const p of state.particles){const a=p.life/70;ctx.fillStyle=`rgba(255,200,80,${a*0.6})`;ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);ctx.fill();}

  // screen flash
  if(state.flash>0.01){ctx.fillStyle=`rgba(255,200,100,${state.flash*0.15})`;ctx.fillRect(0,0,W,H);}

  // snake
  for(let i=state.snake.length-1;i>=0;i--){
    const s=state.snake[i],t=i/Math.max(state.snake.length-1,1),sz=4.5-t*2;
    if(sz<1)continue;
    const r=Math.floor(10+t*5),g=Math.floor(50+t*130),b=Math.floor(60+t*140);
    ctx.fillStyle=`rgba(${r},${g},${b},0.12)`;ctx.beginPath();ctx.arc(s.x,s.y,sz+3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=`rgb(${r},${g},${b})`;ctx.beginPath();ctx.arc(s.x,s.y,sz,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=`rgba(255,255,255,${0.08+t*0.15})`;ctx.beginPath();ctx.arc(s.x-sz*0.25,s.y-sz*0.3,sz*0.45,0,Math.PI*2);ctx.fill();
  }

  // head
  const h=state.snake[0];
  const hg=ctx.createRadialGradient(h.x,h.y,1,h.x,h.y,12);
  hg.addColorStop(0,'rgba(80,200,220,0.2)');hg.addColorStop(1,'rgba(80,200,220,0)');
  ctx.fillStyle=hg;ctx.beginPath();ctx.arc(h.x,h.y,12,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgb(60,210,220)';ctx.beginPath();ctx.arc(h.x,h.y,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.25)';ctx.beginPath();ctx.arc(h.x-1,h.y-1.5,2.2,0,Math.PI*2);ctx.fill();

  const adx=mx-h.x,ady=my-h.y,ad=Math.hypot(adx,ady)||1,ex=adx/ad,ey=ady/ad;
  ctx.fillStyle='#0a0a0a';ctx.beginPath();ctx.arc(h.x+ex*2.2-ey*1.8,h.y+ey*2.2+ex*1.8,1.4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(h.x+ex*2.2+ey*1.8,h.y+ey*2.2-ex*1.8,1.4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(h.x+ex*2.5-ey*1.8,h.y+ey*2.5+ex*1.8,0.55,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(h.x+ex*2.5+ey*1.8,h.y+ey*2.5-ex*1.8,0.55,0,Math.PI*2);ctx.fill();

  // game over
  if(state.dead){document.getElementById('finalScore').textContent='Score: '+state.score;document.getElementById('gameOverOverlay').classList.add('show');c.style.cursor='pointer';}
}

function startGame(){initSnake();state.score=0;state.dead=false;state.playing=true;state.particles=[];state.flash=0;state.frame=0;spawnFruit();document.getElementById('score').textContent='0';document.getElementById('startOverlay').classList.remove('show');document.getElementById('gameOverOverlay').classList.remove('show');c.style.cursor='none';}

document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('retryBtn').addEventListener('click',startGame);
c.addEventListener('click',()=>{if(state.dead)startGame();});

function loop(){pipeline();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
