<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThinkPipe — Watch AI Think</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#040408;color:#f5f5f7;-webkit-font-smoothing:antialiased;overflow-x:hidden}

nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:16px 32px;display:flex;align-items:center;justify-content:space-between;background:rgba(4,4,8,0.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.brand{font-size:14px;font-weight:700;letter-spacing:-0.02em;display:flex;align-items:center;gap:8px}
.brand-dot{width:6px;height:6px;border-radius:50%;background:#5a7aff}
.brand-dot.thinking{animation:thinkPulse 0.8s infinite;background:#34C759}
@keyframes thinkPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.3;transform:scale(1.5)}}
.state{font-size:10px;color:rgba(255,255,255,0.2);text-transform:uppercase;letter-spacing:0.1em;font-weight:600}

.main{padding:80px 32px 40px;max-width:900px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

.question-area{text-align:center;margin-bottom:40px}
.question-area h1{font-size:2rem;font-weight:700;letter-spacing:-0.025em;margin-bottom:24px}
.ask-row{display:flex;gap:10px;max-width:600px;margin:0 auto}
.ask-row input{flex:1;background:#0f0f16;border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:12px 16px;color:#f5f5f7;font-size:14px;font-family:'Inter';outline:none;transition:border-color 0.3s}
.ask-row input:focus{border-color:rgba(90,122,255,0.4)}
.ask-row button{background:#5a7aff;color:#fff;border:none;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:600;font-family:'Inter';cursor:pointer;transition:all 0.2s;white-space:nowrap}
.ask-row button:hover{background:#4a6ae0}

/* ─── PIPE VISUALIZATION ─── */
.pipe-stage{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:32px;height:90px}
.node{padding:10px 20px;border-radius:12px;font-size:11px;font-weight:600;text-align:center;transition:all 0.6s;min-width:70px}
.node.input{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);color:rgba(255,255,255,0.5)}
.node.gate{background:rgba(255,255,255,0.01);border:1px solid rgba(255,255,255,0.03);border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:16px;padding:0;position:relative;color:rgba(255,255,255,0.2);min-width:0}
.node.gate .label{position:absolute;bottom:-18px;font-size:8px;text-transform:uppercase;letter-spacing:0.1em;color:rgba(255,255,255,0.1);white-space:nowrap}
.node.gate.active{border-color:rgba(90,122,255,0.4);background:rgba(90,122,255,0.08);color:#5a7aff;box-shadow:0 0 30px rgba(90,122,255,0.12)}
.node.gate.active .label{color:#5a7aff}
.node.gate.done{border-color:rgba(52,199,89,0.2);background:rgba(52,199,89,0.04);color:#34C759}
.node.output{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);color:rgba(255,255,255,0.4)}
.node.output.ready{border-color:rgba(90,122,255,0.2);color:rgba(255,255,255,0.8)}
.conduit{width:40px;height:1px;background:rgba(255,255,255,0.04);position:relative}
.conduit.live{background:linear-gradient(90deg,rgba(90,122,255,0.3),rgba(0,206,201,0.3))}
.conduit .pulse{position:absolute;top:-2px;width:5px;height:5px;border-radius:50%;background:#5a7aff;opacity:0}
.conduit .pulse.moving{animation:pulseMove 0.6s linear;opacity:1}
@keyframes pulseMove{from{left:0;opacity:1}to{left:calc(100% - 5px);opacity:0}}

.thought-stream{display:flex;flex-direction:column;gap:8px}
.thought-block{background:rgba(255,255,255,0.012);border:1px solid rgba(255,255,255,0.025);border-radius:12px;padding:16px 20px;opacity:0;transform:translateX(-10px);transition:all 0.5s}
.thought-block.visible{opacity:1;transform:translateX(0)}
.thought-block .step-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;color:#5a7aff;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.thought-block .step-label .step-dot{width:5px;height:5px;border-radius:50%;background:#5a7aff}
.thought-block .step-content{font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.75;color:rgba(255,255,255,0.5);white-space:pre-wrap}
.thought-block .step-content .thinking{color:#f5c451}
.thought-block .step-content .insight{color:#34C759}
.thought-block .step-content .warn{color:rgba(255,107,157,0.7)}

.final-output{margin-top:24px;background:rgba(90,122,255,0.03);border:1px solid rgba(90,122,255,0.08);border-radius:14px;padding:20px 24px;opacity:0;transition:all 0.6s 0.5s}
.final-output.visible{opacity:1}
.final-output .final-label{font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:rgba(90,122,255,0.5);margin-bottom:10px}
.final-output .final-text{font-size:14px;line-height:1.7;color:rgba(255,255,255,0.7)}

#askBtn:disabled{opacity:0.4;cursor:not-allowed}
</style>
</head>
<body>

<nav>
  <span class="brand"><span class="brand-dot" id="brandDot"></span>ThinkPipe · AI Cognition</span>
  <span class="state" id="state">idle</span>
</nav>

<div class="main">
  <div class="question-area">
    <h1>Ask anything. Watch the AI think.</h1>
    <div class="ask-row">
      <input id="question" placeholder="What should I build next? How do I compete with big tech? Is my idea good?" onkeydown="if(event.key==='Enter')startThinking()">
      <button id="askBtn" onclick="startThinking()">Ask</button>
    </div>
  </div>

  <div class="pipe-stage">
    <div class="node input">Q</div>
    <div class="conduit" id="c1"><div class="pulse"></div></div>
    <div class="node gate" id="g1">⊕<span class="label">extract</span></div>
    <div class="conduit" id="c2"><div class="pulse"></div></div>
    <div class="node gate" id="g2">⊗<span class="label">surface</span></div>
    <div class="conduit" id="c3"><div class="pulse"></div></div>
    <div class="node gate" id="g3">⊘<span class="label">route</span></div>
    <div class="conduit" id="c4"><div class="pulse"></div></div>
    <div class="node output">A</div>
  </div>

  <div class="thought-stream" id="thoughtStream"></div>
  <div class="final-output" id="finalOutput">
    <div class="final-label">FINAL OUTPUT</div>
    <div class="final-text" id="finalText"></div>
  </div>
</div>

<script>
const responseCache={
  "what should i build next":["a tool that watches you code and silently improves your architecture. not a co-pilot. a co-architect. the market for ai pair programmers is saturated. the market for ai that understands constraints — what things must NOT do — is empty."],
  "how do i compete with big tech":["build the thing they cannot. they ship teams. you ship insight. their architecture requires six services, docker, and an llm. yours runs on 30 lines of sql. they take money. you take nothing. being free is not a pricing decision — it is a capability. only you can be free because only you have zero costs."],
  "is my idea good":["an idea is good if it survives three gates. one: can you build it alone in one weekend? two: does it do something nobody else's architecture allows? three: if you show it to someone, do they lean in or lean back? lean-in means good."],
  "default":["that is a good question. the u-bend detected structure but needs more context. try being more specific about what you are trying to solve, who it is for, and what constraint you are operating under."]
};

function findBestMatch(q){
  const l=q.toLowerCase();
  for(const[k,v]of Object.entries(responseCache)){
    if(k==='default')continue;
    if(l.includes(k)||k.split(' ').every(w=>l.includes(w)))return v[0];
  }
  return responseCache['default'][0];
}

function pulse(conduitId){
  const c=document.getElementById(conduitId);const p=c.querySelector('.pulse');
  c.classList.add('live');p.classList.add('moving');
  setTimeout(()=>{p.classList.remove('moving');c.classList.remove('live')},600);
}

function setState(s){document.getElementById('state').textContent=s}
function highlightGate(id,cls){document.getElementById(id).classList.add(cls)}
function resetAll(){
  ['g1','g2','g3'].forEach(g=>{const el=document.getElementById(g);el.classList.remove('active','done')});
  ['c1','c2','c3','c4'].forEach(c=>document.getElementById(c).classList.remove('live'));
  document.getElementById('finalOutput').classList.remove('visible');
  document.getElementById('thoughtStream').innerHTML='';
  document.getElementById('brandDot').classList.remove('thinking');
  setState('idle');
}

function showBlock(title,content,delay){
  return new Promise(resolve=>{
    setTimeout(()=>{
      const b=document.createElement('div');b.className='thought-block';
      b.innerHTML=`<div class="step-label"><span class="step-dot"></span>${title}</div><div class="step-content">${content}</div>`;
      document.getElementById('thoughtStream').appendChild(b);
      requestAnimationFrame(()=>b.classList.add('visible'));
      resolve();
    },delay);
  });
}

async function startThinking(){
  const q=document.getElementById('question').value.trim();
  if(!q)return;
  const btn=document.getElementById('askBtn');btn.disabled=true;
  resetAll();setState('thinking');
  document.getElementById('brandDot').classList.add('thinking');

  // Gate 1: Extract
  pulse('c1');highlightGate('g1','active');
  await showBlock('EXTRACTING CORE CLAIM',`<span class="thinking">parsing "${q.slice(0,60)}${q.length>60?'...':''}"</span>\n→ ${q.split(' ').length} tokens\n→ identifying central assertion...`,200);
  const core=findBestMatch(q);
  await showBlock('CORE CLAIM IDENTIFIED',`<span class="insight">${core.slice(0,120)}...</span>`,400);
  highlightGate('g1','done');

  // Gate 2: Surface
  pulse('c2');highlightGate('g2','active');
  const assumptions=[
    'this question has implicit constraints the asker may not see',
    'the answer depends on context not provided in the question',
    'the asker is operating under a resource constraint',
  ];
  await showBlock('SURFACING ASSUMPTIONS',assumptions.map((a,i)=>`<span class="thinking">[${i+1}]</span> ${a}`).join('\n'),200);
  highlightGate('g2','done');

  // Gate 3: Route
  pulse('c3');highlightGate('g3','active');
  await showBlock('ROUTING THROUGH CONSTRAINT GATES',`<span class="thinking">checking: relevance > threshold ✓</span>\n<span class="insight">checking: no contradiction ✓</span>\n<span class="warn">checking: dedup — new signal confirmed</span>\n→ routing to output...`,300);
  pulse('c4');highlightGate('g3','done');

  // Output
  await showBlock('U-BEND COMPLETE',`<span class="insight">→ thought routed through 3 gates</span>\n→ 0 API calls · 0 tokens spent · 0 dollars\n→ output ready`,200);
  document.getElementById('output').classList.add('ready');
  document.getElementById('finalText').textContent=core;
  document.getElementById('finalOutput').classList.add('visible');
  document.getElementById('brandDot').classList.remove('thinking');
  setState('idle');btn.disabled=false;
}

document.getElementById('question').focus();
</script>
</body>
</html>
