<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prima · Dissolve</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:#040404;color:#f5f5f7;-webkit-font-smoothing:antialiased;font-weight:300;overflow:hidden;height:100vh;width:100vw;cursor:crosshair}
  canvas{position:fixed;inset:0;z-index:0;display:block}
  #surface{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 48px;pointer-events:none}
  #msg{font-weight:300;font-size:clamp(1.2rem,4vw,2rem);color:#9a9aa2;letter-spacing:0.02em;text-align:center;transition:opacity 1s}
  #text-display{position:fixed;inset:0;z-index:11;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0.12}
  #text-display .word{font-weight:200;font-size:clamp(2rem,7vw,4.8rem);letter-spacing:-0.04em;text-align:center;max-width:36rem}
  #ledger{position:fixed;left:24px;bottom:24px;z-index:3;display:flex;gap:16px;font-family:'SF Mono','Menlo',monospace;font-size:10px;color:rgba(255,255,255,0.2);pointer-events:none;background:rgba(4,4,4,0.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.04);border-radius:8px;padding:10px 18px}
  .s{display:flex;flex-direction:column;align-items:center;gap:3px}.s .lbl{color:#9a9aa2;text-transform:uppercase;font-size:7px;letter-spacing:0.12em}.s .val{color:#f5f5f7;font-variant-numeric:tabular-nums}
  @media(max-width:640px){#surface{padding:0 24px}#ledger{left:12px;bottom:12px;gap:10px;padding:8px 14px}}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="surface"><div id="msg">type to create · watch it dissolve</div></div>
<div id="text-display"><div class="word" id="word"></div></div>

<div id="ledger">
  <div class="s"><div class="lbl">nodes</div><div class="val" id="ncount">0</div></div>
  <div class="s"><div class="lbl">joints</div><div class="val" id="jcount">0</div></div>
  <div class="s"><div class="lbl">alive</div><div class="val" id="alive">0</div></div>
  <div class="s"><div class="lbl">decay</div><div class="val" id="tdecay">0</div></div>
</div>

<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const DPR = Math.min(devicePixelRatio || 1, 2);
let W = 0, H = 0, CX = 0, CY = 0;
function resize() { W = innerWidth; H = innerHeight; c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); CX = W / 2; CY = H / 2; }
resize(); addEventListener('resize', resize);

// ══ NODES — letters ARE clusters of 3-5 living points ══
const nodes = [];
const joints = [];
const MAX_NODES = 400;
const MAX_JOINTS = 1000;
const JOINT_DIST = 50;
let targetDecay = 0.0008, decay = 0.0008;

// 5x3 dot-matrix glyph patterns for each letter
const glyphs = {
  A:[[0,0],[2,0],[1,1],[0,2],[2,2]], B:[[0,0],[2,0],[0,1],[1,1],[0,2],[2,2]], C:[[2,0],[0,1],[0,2],[2,2]],
  D:[[0,0],[1,0],[0,1],[2,1],[0,2],[1,2]], E:[[0,0],[2,0],[0,1],[1,1],[0,2],[2,2]],
  F:[[0,0],[2,0],[0,1],[1,1],[0,2]], G:[[2,0],[0,1],[1,1],[0,2],[2,2],[1,2]],
  H:[[0,0],[2,0],[0,1],[1,1],[2,1],[0,2],[2,2]], I:[[1,0],[1,1],[1,2]], J:[[2,0],[0,2],[1,2],[2,2]],
  K:[[0,0],[2,0],[0,1],[1,1],[0,2],[2,2]], L:[[0,0],[0,1],[0,2],[2,2]], M:[[0,0],[1,1],[2,0],[0,2],[2,2]],
  N:[[0,0],[2,0],[1,1],[0,2],[2,2]], O:[[1,0],[0,1],[2,1],[1,2]], P:[[0,0],[2,0],[0,1],[1,1],[0,2]],
  Q:[[1,0],[0,1],[2,1],[1,2],[2,2]], R:[[0,0],[2,0],[0,1],[1,1],[0,2],[2,2]], S:[[2,0],[0,1],[1,1],[0,2],[2,2]],
  T:[[0,0],[1,0],[2,0],[1,1],[1,2]], U:[[0,0],[2,0],[0,1],[2,1],[0,2],[2,2]], V:[[0,0],[2,0],[1,1],[1,2]],
  W:[[0,0],[1,1],[2,0],[0,2],[2,2]], X:[[0,0],[2,0],[1,1],[0,2],[2,2]], Y:[[0,0],[2,0],[1,1],[1,2]], Z:[[0,0],[2,0],[1,1],[0,2],[2,2]],
  ' ':[[1,0],[0,2],[2,2]], 0:[[0,0],[2,0],[0,1],[2,1],[0,2],[2,2]],
  1:[[1,0],[1,1],[0,1],[1,2]], 2:[[0,0],[2,0],[1,1],[0,2],[2,2]], 3:[[0,0],[2,0],[1,1],[0,2],[2,2]],
  4:[[0,0],[2,0],[0,1],[1,1],[2,1],[2,2]], 5:[[0,0],[2,0],[0,1],[1,1],[0,2],[2,2]],
  6:[[0,0],[2,0],[0,1],[1,1],[0,2],[2,2],[1,2]], 7:[[0,0],[2,0],[0,1],[2,1],[1,1],[1,2]],
  8:[[0,0],[2,0],[0,1],[1,1],[2,1],[0,2],[2,2],[1,2]], 9:[[0,0],[2,0],[0,1],[1,1],[2,1],[0,2],[2,2]],
  ':':[[1,0],[1,2]], '.':[[1,2]], ',':[[1,2],[0,2]], '!':[[1,0],[1,1],[1,2]]
};
let nid = 0;
let originX = 0;

function injectChar(ch, ox, oy) {
  ch = ch.toUpperCase();
  const pattern = glyphs[ch] || glyphs['.'] || [[0,0],[2,0],[1,1],[0,2],[2,2]];
  const scale = Math.min(W, H) * 0.012;
  const groupId = nid;
  const pts = [];
  for (const [gx, gy] of pattern) {
    if (nodes.length >= MAX_NODES) break;
    const n = {
      id: nid++, groupId,
      x: ox + (gx - 1) * scale, y: oy + (gy - 1) * scale,
      bx: ox + (gx - 1) * scale, by: oy + (gy - 1) * scale,
      vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
      life: 1.0, decay: 0.0003 + Math.random() * 0.001,
      radius: 1.6, phase: Math.random() * Math.PI * 2,
      energy: 1.0
    };
    nodes.push(n); pts.push(n);
  }
  return pts;
}

function distFromCenter(n) { return Math.hypot(n.x - CX, n.y - CY) / Math.min(W, H) * 2; }

function neighborAvg(nodes, n, idx) {
  let sx = 0, sy = 0, count = 0;
  for (let i = 0; i < nodes.length; i++) {
    if (i === idx) continue;
    const o = nodes[i]; const d = Math.hypot(n.x - o.x, n.y - o.y);
    if (d < 50) { const w = 1 - d / 50; sx += (o.x - n.x) * w; sy += (o.y - n.y) * w; count++; }
  }
  return count > 0 ? { x: sx / count, y: sy / count } : { x: 0, y: 0 };
}

function step() {
  const t = Date.now() * 0.001;
  decay += (targetDecay - decay) * 0.02;

  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    n.life -= n.decay * (1.0 + decay * 3000);
    if (n.life <= 0) {
      for (let j = 0; j < 2; j++) {
        if (nodes.length < MAX_NODES) nodes.push({ id: nid++, x: n.x + Math.random() * 6 - 3, y: n.y + Math.random() * 6 - 3, vx: Math.random() * 1.5 - 0.75, vy: Math.random() * 1.5 - 0.75, life: 0.3 + Math.random() * 0.2, decay: 0.08 + Math.random() * 0.1, radius: 0.6, phase: Math.random() * Math.PI * 2, energy: 1, groupId: -1 });
      }
      for (let j = joints.length - 1; j >= 0; j--) {
        if (joints[j].a.id === n.id || joints[j].b.id === n.id) joints.splice(j, 1);
      }
      nodes.splice(i, 1); continue;
    }

    // Pull toward glyph position (home) — resists dissolution
    n.vx += (n.bx - n.x) * 0.006; n.vy += (n.by - n.y) * 0.006;

    // Neighbor flocking — group members stick together
    const nb = neighborAvg(nodes, n, i);
    n.vx += nb.x * 0.025; n.vy += nb.y * 0.025;

    // Random walk increases with decay — dissolution accelerates
    n.vx += (Math.random() - 0.5) * decay * 20;
    n.vy += (Math.random() - 0.5) * decay * 20;

    n.vx *= 0.92; n.vy *= 0.92;
    n.x += n.vx; n.y += n.vy;

    // Form joints with nearby nodes
    for (let k = i + 1; k < nodes.length && joints.length < MAX_JOINTS; k++) {
      const o = nodes[k]; const d = Math.hypot(n.x - o.x, n.y - o.y);
      if (d < JOINT_DIST) {
        const polarity = n.groupId === o.groupId && n.groupId >= 0 ? 1 : -1;
        joints.push({ a: n, b: o, p: polarity });
      }
    }
  }

  for (let j = joints.length - 1; j >= 0; j--) {
    const { a, b } = joints[j];
    if (Math.hypot(a.x - b.x, a.y - b.y) > JOINT_DIST * 1.6 || a.life < 0.2 || b.life < 0.2) joints.splice(j, 1);
  }

  const next = Array(nodes.length).fill(0);
  for (const jt of joints) {
    const ia = nodes.indexOf(jt.a), ib = nodes.indexOf(jt.b);
    if (ia >= 0 && ib >= 0) {
      const signal = jt.a.energy * jt.p;
      next[ia] += jt.b.energy * jt.p * 0.005;
      next[ib] += signal * 0.005;
    }
  }
  for (let i = 0; i < nodes.length; i++) {
    nodes[i].energy = Math.max(0.05, Math.min(1, nodes[i].energy * 0.9 + next[i]));
  }
}

function jointColor(p, n) { return p > 0 ? `rgba(90,122,255,${n})` : `rgba(224,106,58,${0.3 * n})`; }

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Faint center marker
  ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.beginPath(); ctx.arc(CX, CY, 3, 0, 6.2832); ctx.fill();

  for (const jt of joints) {
    const alpha = 0.04 + 0.06 * (jt.a.life + jt.b.life) / 2;
    ctx.strokeStyle = jointColor(jt.p, alpha);
    ctx.lineWidth = jt.p > 0 ? 0.5 : 0.3;
    ctx.setLineDash(jt.p > 0 ? [] : [2, 4]);
    ctx.beginPath(); ctx.moveTo(jt.a.x, jt.a.y); ctx.lineTo(jt.b.x, jt.b.y); ctx.stroke();
    ctx.setLineDash([]);
  }

  for (const n of nodes) {
    const r = n.radius * n.life;
    if (r < 0.2) continue;
    // Color: group nodes = blue/white, orphaned = orange
    const inGroup = n.groupId >= 0;
    const blue = inGroup ? `rgba(90,122,255,${0.3 + 0.5 * n.life})` : `rgba(224,106,58,${0.25 + 0.4 * n.life})`;
    ctx.fillStyle = blue; ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 6.2832); ctx.fill();
    // Glow for high-energy nodes
    if (n.energy > 0.5) {
      ctx.fillStyle = `rgba(245,245,247,${0.05 * n.energy * n.life})`;
      ctx.beginPath(); ctx.arc(n.x, n.y, r * 2.5, 0, 6.2832); ctx.fill();
    }
  }

  document.getElementById('ncount').textContent = nodes.length;
  document.getElementById('jcount').textContent = joints.length;
  document.getElementById('alive').textContent = nodes.filter(n => n.life > 0.5).length;
  document.getElementById('tdecay').textContent = (decay * 1000).toFixed(1);
}

function loop() { step(); draw(); requestAnimationFrame(loop); }

// ══ TEXT INPUT — typing injects letter glyphs as living node clusters ══
const wordEl = document.getElementById('word');
const msgEl = document.getElementById('msg');
let textChars = '';
let lastInjection = 0;
let cursorX = 0;

function inputText(ch) {
  if (ch === 'Backspace') {
    textChars = textChars.slice(0, -1);
  } else if (ch === ' ') {
    textChars += ' ';
  } else if (ch.length === 1) {
    textChars += ch;
  }
  wordEl.textContent = textChars || '\u00A0';
  if (textChars.length === 0) { msgEl.style.opacity = '1'; return; }
  msgEl.style.opacity = '0';

  // Inject only the last character
  const last = textChars[textChars.length - 1];
  if (!last || last === ' ') return;

  const scale = Math.min(W, H) * 0.012;
  const charWidth = scale * 4.5;
  const totalWidth = textChars.length * charWidth;
  const startX = CX - totalWidth / 2 + charWidth * (textChars.length - 1);
  injectChar(last, startX, CY);
}

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey) return;
  if (e.key === 'Backspace') { inputText('Backspace'); e.preventDefault(); }
  else if (e.key.length === 1) inputText(e.key);
  else if (e.key === 'Enter') { textChars = ''; wordEl.textContent = '\u00A0'; msgEl.style.opacity = '1'; }
  else if (e.key === 'Escape') {
    // Reset: kill all nodes
    nodes.length = 0; joints.length = 0; textChars = '';
    wordEl.textContent = '\u00A0'; msgEl.style.opacity = '1';
  }
});

requestAnimationFrame(loop);
</script>
</body>
</html>
