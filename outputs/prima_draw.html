<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prima · Draw</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#08080c;color:#f5f5f7;-webkit-font-smoothing:antialiased;font-weight:300;overflow:hidden;height:100vh;width:100vw;cursor:crosshair}
  #morph{position:fixed;inset:0;width:100%;height:100%}
  #hint{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:10;font-size:0.7rem;font-weight:300;color:rgba(255,255,255,0.18);letter-spacing:0.06em;pointer-events:none;transition:opacity 0.8s}
  #count{position:fixed;top:20px;right:24px;z-index:10;font-size:0.62rem;color:rgba(255,255,255,0.18);font-family:'SF Mono','Menlo',monospace;pointer-events:none;text-align:right}
</style>
</head>
<body>

<canvas id="morph"></canvas>
<div id="hint">draw — click &amp; drag on the grid · right‑click — clear all</div>
<div id="count"></div>

<script>
// ══ MORPH GRID — proven engine ══
const C = { bg:'#08080c', blue:'#5a7aff', orange:'#e06a3a', gold:'#f5c451', ink:'#f5f5f7' };
const cv = document.getElementById('morph');
const ctx = cv.getContext('2d');
let DPR = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
const COLS = 26, ROWS = 15;
let nodes = [], strokes = [], drawing = false;
let mx = -9, my = -9, smx = -9, smy = -9;
let targetPhase = 0.5, phase = 0.5;

function buildNodes() {
  const padX = W * 0.06, padY = H * 0.22;
  const gw = (W - padX * 2) / (COLS - 1), gh = (H - padY * 2) / (ROWS - 1);
  const fresh = nodes.length === 0, next = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const tx = padX + c * gw, ty = padY + r * gh;
    if (fresh) next.push({ x: tx, y: ty, bx: tx, by: ty, c, r, bob: Math.random() * 6.28, lit: 0 });
    else { const o = nodes[r * COLS + c]; next.push({ x: o.x, y: o.y, bx: tx, by: ty, c: o.c, r: o.r, bob: o.bob, lit: Math.max(0, o.lit - 0.003) }); }
  }
  nodes = next;
}
function weights(ph) { const b = 0.42; const w0 = Math.exp(-Math.pow((ph - 0) / b, 2)), w1 = Math.exp(-Math.pow((ph - 0.5) / b, 2)), w2 = Math.exp(-Math.pow((ph - 1) / b, 2)); const s = w0 + w1 + w2 || 1; return [w0 / s, w1 / s, w2 / s]; }
function idx(c, r) { return r * COLS + c; }

function nearestNode(x, y) {
  let min = Infinity, ni = -1;
  for (let i = 0; i < nodes.length; i++) {
    const d = Math.hypot(x - nodes[i].x, y - nodes[i].y);
    if (d < min) { min = d; ni = i; }
  }
  return min < 30 ? ni : -1;
}

function draw() {
  requestAnimationFrame(draw);
  if (!W) return;
  const t = performance.now() * 0.001;
  const tightness = Math.max(0.4, Math.min(1.4, 1280 / Math.max(W, 320)));
  const phaseEase = 0.04 + (tightness - 0.4) * 0.05;
  if (smx >= 0 && !drawing) targetPhase = smx / W;
  else if (!drawing && Math.abs(targetPhase - phase) < 0.01) targetPhase += (0.5 - targetPhase) * 0.015;
  phase += (targetPhase - phase) * phaseEase;

  for (const n of nodes) {
    n.x += (n.bx - n.x) * 0.08; n.y += (n.by - n.y) * 0.08;
    if (smx >= 0 && !drawing) { const dx = n.x - mx, dy = n.y - my, d = Math.sqrt(dx * dx + dy * dy); if (d < 120) { const f = (1 - d / 120) * 16; n.x += (dx / d) * f; n.y += (dy / d) * f; } }
    const ox = n.x, oy = n.y; n.x = ox + Math.sin(t * 0.6 + n.bob) * 6; n.y = oy + Math.cos(t * 0.5 + n.bob) * 6;
    n.lit = Math.max(0, n.lit - 0.003);
  }

  // Drawing logic: if drawing, activate nearest node
  if (drawing && smx >= 0) {
    const ni = nearestNode(mx, my);
    if (ni >= 0) nodes[ni].lit = 1;
  }

  const [wA, wF, wN] = weights(phase);
  ctx.clearRect(0, 0, W, H);

  // Standard connections
  ctx.lineWidth = 1; ctx.strokeStyle = C.blue; ctx.globalAlpha = wA * 0.45;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS - 1; c++) { const a = nodes[idx(c, r)], b = nodes[idx(c + 1, r)]; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  ctx.strokeStyle = C.gold; ctx.globalAlpha = wF * 0.36;
  for (let r = 0; r < ROWS - 1; r++) for (let c = 0; c < COLS - 1; c++) { const a = nodes[idx(c, r)], b = nodes[idx(c + 1, r + 1)], a2 = nodes[idx(c + 1, r)], b2 = nodes[idx(c, r + 1)]; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(a2.x, a2.y); ctx.lineTo(b2.x, b2.y); ctx.stroke(); }
  const cx = W / 2, cy = H / 2; ctx.strokeStyle = C.orange; ctx.globalAlpha = wN * 0.32;
  for (const n of nodes) { ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(cx, cy); ctx.stroke(); }

  // Lit connections — draw bright lines between adjacent lit nodes
  ctx.lineWidth = 1.8; ctx.strokeStyle = '#ffffff'; ctx.globalAlpha = 0.7;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS - 1; c++) {
    const a = nodes[idx(c, r)], b = nodes[idx(c + 1, r)];
    if (a.lit > 0.3 && b.lit > 0.3) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  }
  for (let r = 0; r < ROWS - 1; r++) for (let c = 0; c < COLS; c++) {
    const a = nodes[idx(c, r)], b = nodes[idx(c, r + 1)];
    if (a.lit > 0.3 && b.lit > 0.3) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  }

  // Nodes — lit nodes glow white, unlit follow morph color
  ctx.globalAlpha = 1;
  for (const n of nodes) {
    if (n.lit > 0.1) {
      // Glow halo
      ctx.fillStyle = `rgba(255,255,255,${0.15 * n.lit})`;
      ctx.beginPath(); ctx.arc(n.x, n.y, 5 * n.lit, 0, 6.2832); ctx.fill();
      // Core
      ctx.fillStyle = `rgba(255,255,255,${0.9 * n.lit})`;
      ctx.beginPath(); ctx.arc(n.x, n.y, 2.2 * n.lit, 0, 6.2832); ctx.fill();
    } else {
      ctx.fillStyle = wA >= wF && wA >= wN ? C.blue : (wN >= wF ? C.orange : C.gold);
      ctx.beginPath(); ctx.arc(n.x, n.y, 1.6, 0, 6.2832); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  const litCount = nodes.filter(n => n.lit > 0.1).length;
  document.getElementById('count').textContent = litCount > 0 ? litCount + ' lit' : '';
  document.getElementById('hint').style.opacity = litCount > 0 ? '0' : '1';
}

function resize() {
  W = Math.max(window.innerWidth, 100); H = Math.max(window.innerHeight, 100);
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); buildNodes();
}

cv.addEventListener('mousedown', e => {
  drawing = true;
  if (e.button === 2) { strokes = []; for (const n of nodes) n.lit = 0; return; }
  const r = cv.getBoundingClientRect();
  mx = (e.clientX - r.left) * W / r.width; my = (e.clientY - r.top) * H / r.height;
  smx = mx; smy = my;
});
cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  mx = (e.clientX - r.left) * W / r.width; my = (e.clientY - r.top) * H / r.height;
  smx = mx; smy = my;
});
cv.addEventListener('mouseup', () => { drawing = false; });
cv.addEventListener('mouseleave', () => { drawing = false; smx = -9; });
cv.addEventListener('contextmenu', e => { e.preventDefault(); strokes = []; for (const n of nodes) n.lit = 0; });
window.addEventListener('resize', resize);
resize(); draw();
</script>
</body>
</html>
