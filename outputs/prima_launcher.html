<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Prima Launcher</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
<style>
:root {
  --wallpaper-start: #0a0a1a;
  --wallpaper-end: #1a0a2e;
  --glass: rgba(255,255,255,0.06);
  --glass-strong: rgba(255,255,255,0.10);
  --accent: #5a7aff;
  --ink: #ffffff;
  --mute: rgba(255,255,255,0.55);
  --faint: rgba(255,255,255,0.3);
  --battery: #4caf50;
  --status-bg: rgba(0,0,0,0.25);
  --icon-radius: 18px;
  --dock-radius: 28px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

.wallpaper {
  position:fixed;inset:0;z-index:0;
  background:linear-gradient(160deg, var(--wallpaper-start) 0%, #0d0d28 30%, var(--wallpaper-end) 70%, #1a0a20 100%);
  transition:transform 0.1s ease-out;
}
.wallpaper-orb {
  position:absolute;border-radius:50%;filter:blur(80px);opacity:0.08;
}
.wallpaper-orb.a{width:300px;height:300px;background:var(--accent);top:10%;left:-50px}
.wallpaper-orb.b{width:250px;height:250px;background:#ff6b9d;bottom:20%;right:-80px}
.wallpaper-orb.c{width:200px;height:200px;background:#00cec9;top:50%;left:60%}

.status-bar {
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 24px 10px;height:44px;
  background:linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 100%);
}
.status-bar .time{font-size:13px;font-weight:600;color:var(--ink)}
.status-bar .right{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink)}
.status-bar .battery{width:24px;height:12px;border:1.5px solid var(--ink);border-radius:3px;padding:2px;position:relative}
.status-bar .battery::after{content:'';position:absolute;right:-3px;top:2px;width:2px;height:7px;background:var(--ink);border-radius:0 2px 2px 0}
.status-bar .battery .fill{height:100%;background:var(--battery);border-radius:1px;width:82%}

.pages-wrapper {
  position:fixed;inset:0;z-index:1;overflow:hidden;
  padding-top:44px;padding-bottom:100px;
}
.pages-track {
  display:flex;height:100%;transition:transform 0.35s cubic-bezier(0.25,0.1,0.25,1);
  will-change:transform;
}
.page {
  flex:0 0 100%;height:100%;padding:20px;
  display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);
  gap:12px;align-content:start;
}
.page-indicator {
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:2;
  display:flex;gap:6px;
}
.page-indicator .dot{width:6px;height:6px;border-radius:50%;background:var(--faint);transition:all 0.3s}
.page-indicator .dot.active{background:var(--accent);width:16px;border-radius:3px}

.widget-area {
  position:fixed;z-index:2;top:64px;left:24px;right:24px;
  display:flex;flex-direction:column;gap:14px;
}
.clock-widget {
  display:flex;flex-direction:column;
}
.clock-time {
  font-size:64px;font-weight:200;letter-spacing:-0.03em;color:var(--ink);line-height:1;
}
.clock-date {
  font-size:13px;font-weight:400;color:var(--mute);margin-top:4px;
}
.weather-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.weather-row .temp{font-size:18px;color:var(--ink);font-weight:500}
.search-bar {
  display:flex;align-items:center;gap:10px;
  background:var(--glass-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:20px;padding:11px 16px;margin-top:6px;border:1px solid rgba(255,255,255,0.06);
}
.search-bar .icon{font-size:15px;color:var(--mute)}
.search-bar .text{font-size:14px;color:var(--faint);font-weight:400}

.app-icon {
  display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;position:relative;
  transition:transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
}
.app-icon:active{transform:scale(0.85)}
.app-icon .icon-bg {
  width:54px;height:54px;border-radius:var(--icon-radius);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;position:relative;overflow:hidden;
  background:linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  box-shadow:0 2px 8px rgba(0,0,0,0.2);
  transition:box-shadow 0.2s;
}
.app-icon:active .icon-bg{box-shadow:0 0 16px rgba(90,122,255,0.3)}
.app-icon .icon-bg .ripple {
  position:absolute;border-radius:50%;background:rgba(255,255,255,0.2);
  transform:scale(0);animation:ripple 0.4s ease-out;
}
@keyframes ripple{to{transform:scale(4);opacity:0}}
.app-icon .label{font-size:11px;font-weight:400;color:var(--mute);text-align:center;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.dock {
  position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:50;
  display:flex;gap:8px;padding:8px 18px;
  background:var(--glass);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border-radius:var(--dock-radius);border:1px solid rgba(255,255,255,0.06);
  box-shadow:0 8px 32px rgba(0,0,0,0.3);
}
.dock-icon {
  width:48px;height:48px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;cursor:pointer;transition:transform 0.15s;
}
.dock-icon:active{transform:scale(0.88)}

.app-drawer {
  position:fixed;inset:0;z-index:200;
  background:rgba(10,10,20,0.97);backdrop-filter:blur(40px);
  transform:translateY(110%);transition:transform 0.4s cubic-bezier(0.32,0.72,0,1);
  display:flex;flex-direction:column;padding-top:56px;
}
.app-drawer.open{transform:translateY(0)}
.drawer-handle{width:36px;height:4px;background:var(--faint);border-radius:2px;margin:0 auto 20px}
.drawer-search{margin:0 20px 20px;padding:12px 16px;background:var(--glass-strong);border:1px solid rgba(255,255,255,0.06);border-radius:14px;color:var(--ink);font-family:'Inter';font-size:15px;outline:none}
.drawer-grid {
  display:grid;grid-template-columns:repeat(4,1fr);gap:20px;
  padding:0 20px;overflow-y:auto;flex:1;align-content:start;
}

.notification-shade {
  position:fixed;inset:0;z-index:150;
  background:rgba(8,8,16,0.95);backdrop-filter:blur(40px);
  transform:translateY(-110%);transition:transform 0.3s ease-out;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--mute);font-size:14px;
}
.notification-shade.show{transform:translateY(0)}

.nav-hint {
  position:fixed;bottom:2px;left:50%;transform:translateX(-50%);
  width:120px;height:4px;background:var(--faint);border-radius:2px;z-index:10;
}
</style>
</head>
<body>

<div class="wallpaper" id="wallpaper">
  <div class="wallpaper-orb a"></div><div class="wallpaper-orb b"></div><div class="wallpaper-orb c"></div>
</div>

<div class="status-bar">
  <div class="time" id="statusTime">9:41</div>
  <div class="right">
    <span>5G</span>
    <svg width="14" height="10" viewBox="0 0 14 10"><rect x="0" y="6" width="2.5" height="4" rx="1" fill="white"/><rect x="3.5" y="4" width="2.5" height="6" rx="1" fill="white"/><rect x="7" y="2" width="2.5" height="8" rx="1" fill="white"/><rect x="10.5" y="0" width="2.5" height="10" rx="1" fill="white" opacity="0.4"/></svg>
    <svg width="14" height="10" viewBox="0 0 14 10"><path d="M7 2 Q9 2 11 1.5" stroke="white" stroke-width="1.2" fill="none"/><path d="M4.2 4 Q7 3.5 9.8 4" stroke="white" stroke-width="1.2" fill="none"/><path d="M1.5 6 Q4 5.5 7 5.5 Q10 5.5 12.5 6" stroke="white" stroke-width="1.2" fill="none"/><path d="M0 8 Q3.5 7.5 7 7.5 Q10.5 7.5 14 8" stroke="white" stroke-width="1.2" fill="none"/></svg>
    <div class="battery"><div class="fill"></div></div>
  </div>
</div>

<div class="widget-area">
  <div class="clock-widget">
    <div class="clock-time" id="clockTime">9:41</div>
    <div class="clock-date" id="clockDate">Monday, August 4</div>
  </div>
  <div class="weather-row">
    <span style="font-size:22px">☀️</span>
    <span class="temp">24°</span>
    <span>Clear sky · San Francisco</span>
  </div>
  <div class="search-bar">
    <span class="icon">🔍</span>
    <span class="text">Search apps, contacts...</span>
  </div>
</div>

<div class="pages-wrapper" id="pagesWrapper">
  <div class="pages-track" id="pagesTrack">
    <div class="page" id="page0"></div>
    <div class="page" id="page1"></div>
  </div>
</div>

<div class="page-indicator" id="pageIndicator">
  <div class="dot active"></div><div class="dot"></div>
</div>

<div class="dock">
  <div class="dock-icon" style="background:linear-gradient(135deg,#5a7aff,#0d47a1)">📞</div>
  <div class="dock-icon" style="background:linear-gradient(135deg,#00cec9,#004d40)">💬</div>
  <div class="dock-icon" style="background:linear-gradient(135deg,#ff6b9d,#880e4f)">🌐</div>
  <div class="dock-icon" style="background:linear-gradient(135deg,#e06a3a,#bf360c)">📷</div>
</div>

<div class="app-drawer" id="drawer">
  <div class="drawer-handle"></div>
  <input class="drawer-search" placeholder="Search apps..." id="drawerSearch">
  <div class="drawer-grid" id="drawerGrid"></div>
</div>

<div class="notification-shade" id="notificationShade">
  <div style="font-size:40px;margin-bottom:16px">🔔</div>
  <div>No notifications</div>
</div>

<div class="nav-hint"></div>

<script>
const APPS_PAGE1 = [
  {n:"Camera",i:"📷"},{n:"Photos",i:"🖼️"},{n:"Maps",i:"🗺️"},{n:"Clock",i:"⏰"},
  {n:"Weather",i:"🌤️"},{n:"Calendar",i:"📅"},{n:"Notes",i:"📝"},{n:"Files",i:"📁"},
  {n:"Music",i:"🎵"},{n:"Videos",i:"🎬"},{n:"Mail",i:"📧"},{n:"Settings",i:"⚙️"},
  {n:"Health",i:"❤️"},{n:"Wallet",i:"💳"},{n:"Home",i:"🏠"},{n:"Calculator",i:"🔢"}
];
const APPS_PAGE2 = [
  {n:"Browser",i:"🌐"},{n:"Chat",i:"💬"},{n:"Fitness",i:"💪"},{n:"Bank",i:"🏦"},
  {n:"Store",i:"🛒"},{n:"Books",i:"📚"},{n:"Podcasts",i:"🎙️"},{n:"Reminders",i:"✅"},
  {n:"Translate",i:"🌍"},{n:"Drive",i:"☁️"},{n:"Recorder",i:"🎤"},{n:"News",i:"📰"},
  {n:"Contacts",i:"👥"},{n:"Measure",i:"📐"},{n:"Magnifier",i:"🔍"},{n:"Shortcuts",i:"⚡"}
];
const ALL_APPS = [...APPS_PAGE1,...APPS_PAGE2].sort((a,b)=>a.n.localeCompare(b.n));

let currentPage=0,totalPages=2,touchStartX=0,touchStartY=0,drawerOpen=false;

function makeIcon(app){
  const d=document.createElement('div');d.className='app-icon';
  d.innerHTML=`<div class="icon-bg"><span>${app.i}</span></div><div class="label">${app.n}</div>`;
  d.addEventListener('pointerdown',e=>{
    const r=d.querySelector('.icon-bg');
    const ripple=document.createElement('div');ripple.className='ripple';
    const rect=r.getBoundingClientRect();
    ripple.style.left=(e.clientX-rect.left-20)+'px';
    ripple.style.top=(e.clientY-rect.top-20)+'px';
    ripple.style.width='40px';ripple.style.height='40px';
    r.appendChild(ripple);
    setTimeout(()=>ripple.remove(),400);
  });
  return d;
}

function renderPages(){
  document.getElementById('page0').innerHTML='';
  document.getElementById('page1').innerHTML='';
  APPS_PAGE1.forEach(a=>document.getElementById('page0').appendChild(makeIcon(a)));
  APPS_PAGE2.forEach(a=>document.getElementById('page1').appendChild(makeIcon(a)));
}

function renderDrawer(){
  const grid=document.getElementById('drawerGrid');
  grid.innerHTML='';
  ALL_APPS.forEach(a=>grid.appendChild(makeIcon(a)));
}

function goToPage(p){
  currentPage=Math.max(0,Math.min(totalPages-1,p));
  document.getElementById('pagesTrack').style.transform=`translateX(-${currentPage*100}%)`;
  document.querySelectorAll('.page-indicator .dot').forEach((d,i)=>{
    d.classList.toggle('active',i===currentPage);
  });
}

const wrapper=document.getElementById('pagesWrapper');
wrapper.addEventListener('touchstart',e=>{
  touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;
},{passive:true});
wrapper.addEventListener('touchmove',e=>{
  const dx=e.touches[0].clientX-touchStartX,dy=e.touches[0].clientY-touchStartY;
  if(Math.abs(dx)>Math.abs(dy))e.preventDefault();
},{passive:false});
wrapper.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchStartX;
  if(dx<-60)goToPage(currentPage+1);
  else if(dx>60)goToPage(currentPage-1);
});

let dockTouchY=0;
document.querySelector('.dock').addEventListener('touchstart',e=>{
  dockTouchY=e.touches[0].clientY;
});
document.querySelector('.dock').addEventListener('touchmove',e=>{
  if(e.touches[0].clientY-dockTouchY<-40){openDrawer();dockTouchY=9999;}
});

document.getElementById('drawer').addEventListener('touchstart',e=>{
  if(e.target===document.getElementById('drawer'))closeDrawer();
});

function openDrawer(){
  drawerOpen=true;document.getElementById('drawer').classList.add('open');
  document.getElementById('navHint').style.opacity='0';
}
function closeDrawer(){
  drawerOpen=false;document.getElementById('drawer').classList.remove('open');
  document.getElementById('navHint').style.opacity='1';
}

// Notification shade
document.addEventListener('touchstart',e=>{
  if(e.touches[0].clientY<20&&drawerOpen){
    document.getElementById('notificationShade').classList.add('show');
    setTimeout(()=>document.getElementById('notificationShade').classList.remove('show'),2000);
  }
});

// Parallax wallpaper
window.addEventListener('deviceorientation',e=>{
  if(!e.gamma)return;
  const x=(e.gamma/45)*3,y=(e.beta/45)*3;
  document.getElementById('wallpaper').style.transform=`translate(${x}px,${y}px) scale(1.05)`;
},true);

// Clock
function updateClock(){
  const now=new Date();
  const h=now.getHours(),m=now.getMinutes().toString().padStart(2,'0');
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('clockTime').textContent=`${h}:${m}`;
  document.getElementById('statusTime').textContent=`${h}:${m}`;
  document.getElementById('clockDate').textContent=`${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
}
setInterval(updateClock,10000);updateClock();

renderPages();renderDrawer();goToPage(0);
</script>
</body>
</html>
