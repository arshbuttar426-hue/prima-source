<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThinkPipe — Live AI Brain</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#040408;color:#f5f5f7;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;background:rgba(4,4,8,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.brand{font-size:13px;font-weight:700;letter-spacing:-0.02em;display:flex;align-items:center;gap:8px}
.brand-dot{width:6px;height:6px;border-radius:50%;background:#34C759}
.brand-dot.disconnected{background:rgba(255,255,255,0.2)}
.state{font-size:10px;color:rgba(255,255,255,0.25);text-transform:uppercase;letter-spacing:0.1em;font-weight:600}
.conn-dot{width:5px;height:5px;border-radius:50%;display:inline-block;margin-right:6px}
.conn-dot.connected{background:#34C759}.conn-dot.disconnected{background:rgba(255,255,255,0.15)}

.main{padding-top:70px;max-width:900px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:rgba(255,255,255,0.1);font-size:18px;gap:8px}
.empty-state .pipe-icon{font-size:48px;margin-bottom:12px;opacity:0.3}

.pipe-stage{display:flex;align-items:center;justify-content:center;gap:0;padding:20px 0 12px;height:80px;border-bottom:1px solid rgba(255,255,255,0.02)}
.node{padding:8px 16px;border-radius:10px;font-size:10px;font-weight:600;text-align:center;transition:all 0.5s;min-width:56px}
.node.inq{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);color:rgba(255,255,255,0.5)}
.node.gate{background:rgba(255,255,255,0.01);border:1px solid rgba(255,255,255,0.03);border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:14px;padding:0;position:relative;color:rgba(255,255,255,0.15);min-width:0}
.node.gate .lbl{position:absolute;bottom:-16px;font-size:7px;text-transform:uppercase;letter-spacing:0.1em;color:rgba(255,255,255,0.08);white-space:nowrap}
.node.gate.on{border-color:rgba(90,122,255,0.5);background:rgba(90,122,255,0.1);color:#5a7aff;box-shadow:0 0 24px rgba(90,122,255,0.12)}
.node.gate.on .lbl{color:#5a7aff}
.node.gate.done{border-color:rgba(52,199,89,0.2);color:#34C759}
.node.ans{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);color:rgba(255,255,255,0.4)}
.node.ans.ready{border-color:rgba(90,122,255,0.2);color:rgba(255,255,255,0.8)}
.line{width:36px;height:1px;background:rgba(255,255,255,0.03);position:relative}
.line.on{background:linear-gradient(90deg,rgba(90,122,255,0.3),rgba(0,206,201,0.3))}
.line .dot{position:absolute;top:-1.5px;width:4px;height:4px;border-radius:50%;background:#5a7aff;opacity:0}
.line .dot.mv{animation:mv 0.5s linear;opacity:1}
@keyframes mv{from{left:0}to{left:calc(100% - 4px)}}

.stream{padding:12px 20px;display:flex;flex-direction:column;gap:6px;flex:1;overflow-y:auto}
.block{background:rgba(255,255,255,0.01);border:1px solid rgba(255,255,255,0.02);border-radius:10px;padding:12px 16px;opacity:0;transform:translateX(-8px);transition:all 0.4s}
.block.in{opacity:1;transform:translateX(0)}
.block .hdr{font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:#5a7aff;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.block .hdr .d{width:4px;height:4px;border-radius:50%;background:#5a7aff}
.block .cnt{font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.65;color:rgba(255,255,255,0.4);white-space:pre-wrap}
.block .cnt .t{color:#f5c451}.block .cnt .i{color:#34C759}.block .cnt .w{color:rgba(255,107,157,0.6)}
.block.q-block{background:rgba(255,255,255,0.015);border-color:rgba(255,255,255,0.03)}
.block.q-block .hdr{color:rgba(255,255,255,0.3)}
.block.q-block .cnt{color:rgba(255,255,255,0.5)}

.final{padding:16px 20px;margin:12px 20px;background:rgba(90,122,255,0.03);border:1px solid rgba(90,122,255,0.06);border-radius:12px;opacity:0;transition:all 0.5s}
.final.in{opacity:1}
.final .fhdr{font-size:8px;text-transform:uppercase;letter-spacing:0.1em;color:rgba(90,122,255,0.4);margin-bottom:8px}
.final .ftxt{font-size:13px;line-height:1.6;color:rgba(255,255,255,0.65)}
</style>
</head>
<body>

<nav>
  <span class="brand"><span class="brand-dot disconnected" id="bdot"></span>ThinkPipe</span>
  <span class="state"><span class="conn-dot disconnected" id="cdot"></span><span id="state">disconnected</span></span>
</nav>

<div class="main">
  <div class="pipe-stage">
    <div class="node inq">Q</div>
    <div class="line" id="l1"><div class="dot"></div></div>
    <div class="node gate" id="g1">⊕<span class="lbl">extract</span></div>
    <div class="line" id="l2"><div class="dot"></div></div>
    <div class="node gate" id="g2">⊗<span class="lbl">surface</span></div>
    <div class="line" id="l3"><div class="dot"></div></div>
    <div class="node gate" id="g3">⊘<span class="lbl">resolve</span></div>
    <div class="line" id="l4"><div class="dot"></div></div>
    <div class="node ans">A</div>
  </div>
  <div class="stream" id="stream"></div>
  <div class="final" id="final"><div class="fhdr">RESPONSE</div><div class="ftxt" id="finalTxt"></div></div>
  <div class="empty-state" id="empty">
    <div class="pipe-icon">↻</div>
    <div>waiting for thought...</div>
    <div style="font-size:11px;margin-top:4px;color:rgba(255,255,255,0.05)">bridge ws://127.0.0.1:9125</div>
  </div>
</div>

<script>
const WS_URL='ws://127.0.0.1:9125';
let ws=null;

function setConnected(c){
  const dot=document.getElementById('cdot');const bdot=document.getElementById('bdot');
  const state=document.getElementById('state');
  dot.className='conn-dot '+(c?'connected':'disconnected');
  bdot.className='brand-dot'+(c?'':' disconnected');
  state.textContent=c?'connected':'disconnected';
}

function pulse(lineId){
  const l=document.getElementById(lineId);const d=l.querySelector('.dot');
  l.classList.add('on');d.classList.add('mv');
  setTimeout(()=>{d.classList.remove('mv');l.classList.remove('on')},500);
}

function resetAll(){
  ['g1','g2','g3'].forEach(g=>document.getElementById(g).classList.remove('on','done'));
  ['l1','l2','l3','l4'].forEach(l=>document.getElementById(l).classList.remove('on'));
  document.getElementById('stream').innerHTML='';
  document.getElementById('final').classList.remove('in');
  document.getElementById('finalTxt').textContent='';
  document.getElementById('empty').style.display='flex';
  document.querySelector('.node.ans').classList.remove('ready');
}

function addBlock(title,content,cls=''){
  const b=document.createElement('div');b.className='block'+(' '+cls);
  b.innerHTML=`<div class="hdr"><span class="d"></span>${title}</div><div class="cnt">${content}</div>`;
  document.getElementById('stream').appendChild(b);
  requestAnimationFrame(()=>b.classList.add('in'));
  b.scrollIntoView({behavior:'smooth',block:'end'});
}

function connect(){
  ws=new WebSocket(WS_URL);
  ws.onopen=()=>{setConnected(true);document.getElementById('empty').style.display='flex'};
  ws.onclose=()=>{setConnected(false);setTimeout(connect,2000)};
  ws.onmessage=ev=>{
    const data=JSON.parse(ev.data);
    if(data.type==='thinking_start'){
      resetAll();
      document.getElementById('empty').style.display='none';
      addBlock('QUESTION',data.question,'q-block');
    }else if(data.type==='thinking_step'){
      const s=data;
      pulse('l'+(s.gate||1));
      const gid='g'+(s.gate||1);
      document.getElementById(gid).classList.add('on');
      if(s.done)document.getElementById(gid).classList.add('done');
      if(s.title&&s.content)addBlock(s.title,s.content);
    }else if(data.type==='thinking_done'){
      ['g1','g2','g3'].forEach(g=>document.getElementById(g).classList.add('done'));
      document.querySelector('.node.ans').classList.add('ready');
      document.getElementById('finalTxt').textContent=data.response;
      document.getElementById('final').classList.add('in');
    }
  };
}

connect();
</script>
</body>
</html>
