<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prima · Breath Decrypter</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:#040404;color:#f5f5f7;-webkit-font-smoothing:antialiased;font-weight:300;line-height:1.618;overflow:hidden;height:100vh;width:100vw;cursor:crosshair}
  canvas{position:fixed;inset:0;z-index:0;display:block}
  #surface{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 48px;pointer-events:none}
  #headline{font-weight:200;font-size:clamp(2rem,7vw,4.8rem);letter-spacing:-0.04em;line-height:1.08;text-align:center;max-width:36rem;margin-bottom:12px}
  #sub{font-size:0.78rem;font-weight:400;letter-spacing:0.1em;text-transform:uppercase;color:#9a9aa2}
  #ledger{position:fixed;left:24px;bottom:24px;z-index:3;display:flex;gap:20px;font-family:'SF Mono','Menlo',monospace;font-size:11px;color:rgba(255,255,255,0.24);pointer-events:none;background:rgba(4,4,4,0.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.04);border-radius:8px;padding:12px 20px}
  .stat{display:flex;flex-direction:column;align-items:center;gap:4px}
  .stat .lbl{color:#9a9aa2;text-transform:uppercase;font-size:7px;letter-spacing:0.12em}
  .stat .val{color:#f5f5f7;font-variant-numeric:tabular-nums}
  #controls{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:24px}
  #controls button{padding:8px 20px;background:none;border:1px solid rgba(255,255,255,0.12);border-radius:6px;color:rgba(255,255,255,0.4);font-family:inherit;font-size:0.7rem;font-weight:400;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;transition:all 0.2s}
  #controls button:hover{color:#f5f5f7;border-color:rgba(255,255,255,0.5)}
  #controls button.active{color:#f5f5f7;border-color:#f5f5f7}
  @media(max-width:640px){#surface{padding:0 24px}#controls{gap:12px}#ledger{left:12px;bottom:12px;gap:12px;padding:8px 14px;font-size:9px}}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="surface">
  <div id="headline"></div>
  <div id="sub"></div>
</div>

<div id="ledger">
  <div class="stat"><div class="lbl">alive</div><div class="val" id="alive">0</div></div>
  <div class="stat"><div class="lbl">as</div><div class="val" id="ascount">0</div></div>
  <div class="stat"><div class="lbl">frontier</div><div class="val" id="frcount">0</div></div>
  <div class="stat"><div class="lbl">not_as</div><div class="val" id="nascount">0</div></div>
  <div class="stat"><div class="lbl">joints</div><div class="val" id="jtcount">0</div></div>
</div>

<div id="controls">
  <button data-mode="poem" class="active">Poem</button>
  <button data-mode="clock">Clock</button>
  <button data-mode="scramble">Scramble</button>
  <button data-mode="type">Type</button>
</div>

<script>
// ══ BREATH ECOSYSTEM — verbatim engine from prima_breath.html ══
// Adapted: nodes spawn at alphabet column positions instead of random angles.
// Each typed letter injects a node at its column's angular position.

const REDUCE = matchMedia('(prefers-reduced-motion:reduce)').matches;
const c = document.getElementById('c'), ctx = c.getContext('2d');
const DPR = Math.min(devicePixelRatio || 1, 2);
let W = 0, H = 0, CX = 0, CY = 0;

function resize() { W = innerWidth; H = innerHeight; c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); CX = W / 2; CY = H / 2; }
resize(); addEventListener('resize', resize);

const nodes = [];
const joints = [];
const MAX_NODES = 320;
const MAX_JOINTS = 900;
const AS_RADIUS = 0.22;
const FRONTIER_WIDTH = 0.12;
const JOINT_DIST = 46;
let scrollTempo = 0.5;
let nid = 0;
let clickCharge = { x: 0, y: 0, life: 0 };

function distFromCenter(n) { return Math.hypot(n.x - CX, n.y - CY) / Math.min(W, H) * 2; }

function classify(n) {
  const r = distFromCenter(n);
  if (r < AS_RADIUS) return 'as';
  if (r < AS_RADIUS + FRONTIER_WIDTH) return 'frontier';
  return 'not_as';
}

function injectLetter(ch) {
  const code = ch.toUpperCase().charCodeAt(0);
  if (code < 65 || code > 90) return;
  const col = code - 65;
  if (nodes.length >= MAX_NODES) return;
  // Map column to angle: A=right(0), M=left(PI), Z ≈ 11π/13
  const angle = (col / 26) * Math.PI * 2;
  const dist = (Math.min(W, H) * 0.06) * (0.5 + Math.random() * 1.0);
  nodes.push({
    id: nid++,
    x: CX + Math.cos(angle) * dist, y: CY + Math.sin(angle) * dist,
    vx: Math.cos(angle) * 0.4, vy: Math.sin(angle) * 0.4,
    state: 'as',
    life: 1.0, age: 0,
    energy: 1.0,
    decay: 0.0003 + Math.random() * 0.001,
    radius: 1.4 + Math.random() * 1.6,
    phase: Math.random() * Math.PI * 2
  });
}

function neighborAvg(nodes, n, idx) {
  let sx = 0, sy = 0, count = 0;
  for (let i = 0; i < nodes.length; i++) {
    if (i === idx) continue;
    const o = nodes[i];
    const d = Math.hypot(n.x - o.x, n.y - o.y);
    if (d < 50) { const w = (1 - d / 50); sx += (o.x - n.x) * w; sy += (o.y - n.y) * w; count++; }
  }
  return count > 0 ? { x: sx / count, y: sy / count } : { x: 0, y: 0 };
}

function step() {
  const t = Date.now() * 0.001;
  const breath = Math.sin(t * 0.3) * 0.5 + 0.5;
  const effectiveAsRadius = AS_RADIUS + breath * 0.06;

  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    n.age += 0.016;
    n.life -= n.decay * (1.0 + scrollTempo * 2);

    const dist = distFromCenter(n);
    if (Math.random() < 0.008) n.state = classify(n);

    let fx = 0, fy = 0;
    const driftStrength = 0.02 + 0.04 * scrollTempo;
    const angle = Math.atan2(n.y - CY, n.x - CX);
    if (n.state === 'not_as') { fx += Math.cos(angle) * driftStrength * 2; fy += Math.sin(angle) * driftStrength * 2; }
    else if (n.state === 'frontier') { fx += Math.cos(angle) * driftStrength * 0.6; fy += Math.sin(angle) * driftStrength * 0.6; }
    else { fx += Math.cos(angle) * driftStrength * 0.15; fy += Math.sin(angle) * driftStrength * 0.15; }

    const nb = neighborAvg(nodes, n, i);
    if (n.state === 'as') { fx += nb.x * 0.04; fy += nb.y * 0.04; }
    else if (n.state === 'frontier') { fx += nb.x * 0.01; fy += nb.y * 0.01; }
    else { fx -= nb.x * 0.03; fy -= nb.y * 0.03; }

    if (clickCharge.life > 0) {
      const cdx = n.x - clickCharge.x, cdy = n.y - clickCharge.y;
      const cd = Math.hypot(cdx, cdy) + 1;
      if (cd < 120) { fx += cdx / cd * clickCharge.life * 2; fy += cdy / cd * clickCharge.life * 2; }
    }

    if (n.state === 'as' && dist > effectiveAsRadius) { fx -= Math.cos(angle) * 0.8; fy -= Math.sin(angle) * 0.8; }
    if (n.state === 'not_as' && dist < (effectiveAsRadius + FRONTIER_WIDTH)) { fx += Math.cos(angle) * 0.5; fy += Math.sin(angle) * 0.5; }

    fx += Math.sin(t * 2.5 + n.phase) * 0.04;
    fy += Math.cos(t * 2.5 + n.phase) * 0.04;

    n.vx = (n.vx + fx) * 0.88; n.vy = (n.vy + fy) * 0.88;
    n.x += n.vx; n.y += n.vy;

    if (n.life <= 0 || dist > 0.85) {
      if (n.life <= 0) {
        for (let j = 0; j < 3; j++) {
          nodes.push({ id: nid++, x: n.x + Math.random() * 8 - 4, y: n.y + Math.random() * 8 - 4, vx: Math.random() * 2 - 1, vy: Math.random() * 2 - 1, state: 'not_as', life: 0.4 + Math.random() * 0.3, age: 0, decay: 0.06 + Math.random() * 0.08, radius: 0.6, phase: Math.random() * Math.PI * 2, energy: 1 });
        }
      }
      for (let j = joints.length - 1; j >= 0; j--) {
        if (joints[j].a.id === n.id || joints[j].b.id === n.id) joints.splice(j, 1);
      }
      nodes.splice(i, 1);
      continue;
    }

    for (let k = i + 1; k < nodes.length; k++) {
      if (joints.length >= MAX_JOINTS) break;
      const o = nodes[k];
      const d = Math.hypot(n.x - o.x, n.y - o.y);
      if (d < JOINT_DIST) {
        let polarity;
        if (n.state === 'not_as' || o.state === 'not_as') polarity = -1;
        else if (n.state === 'as' && o.state === 'as') polarity = 1;
        else polarity = Math.random() < 0.5 ? 1 : -1;
        joints.push({ a: n, b: o, p: polarity, active: true });
      }
    }
  }

  for (let j = joints.length - 1; j >= 0; j--) {
    const { a, b } = joints[j];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (d > JOINT_DIST * 1.6 || a.life < 0.3 || b.life < 0.3) joints.splice(j, 1);
  }

  const next = Array(nodes.length).fill(0);
  for (const jt of joints) {
    const signal = jt.a.energy * jt.p;
    const ia = nodes.indexOf(jt.a), ib = nodes.indexOf(jt.b);
    if (ia >= 0 && ib >= 0) { next[ia] += jt.b.energy * jt.p; next[ib] += signal; }
  }
  for (let i = 0; i < nodes.length; i++) {
    nodes[i].energy = Math.max(0, Math.min(1, nodes[i].energy * 0.85 + next[i] * 0.02));
  }
  for (const nd of nodes) {
    if (nd.state === 'as' && distFromCenter(nd) < 0.2) nd.energy = Math.max(nd.energy, 0.4 + 0.2 * Math.sin(t * 1.5 + nd.phase));
  }

  if (clickCharge.life > 0) clickCharge.life -= 0.06;
}

function jointColor(jit, n) { return jit < 0 ? 'rgba(224,106,58,' + n + ')' : 'rgba(59,130,246,' + n + ')'; }

function draw() {
  ctx.clearRect(0, 0, W, H);
  const t = Date.now() * 0.001;
  const breath = Math.sin(t * 0.3) * 0.5 + 0.5;

  for (let i = 0; i < 3; i++) {
    const r = (AS_RADIUS + 0.03 * i) * Math.min(W, H) * 0.5;
    ctx.strokeStyle = `rgba(245,245,247,${(0.04 - 0.01 * i) * (0.7 + 0.3 * breath)})`; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.arc(CX, CY, r, 0, 6.2832); ctx.stroke();
  }
  const fr = AS_RADIUS * Math.min(W, H) * 0.5, fw = FRONTIER_WIDTH * Math.min(W, H) * 0.5;
  ctx.strokeStyle = `rgba(212,168,83,${0.04 + 0.02 * breath})`; ctx.lineWidth = fw * 2;
  ctx.beginPath(); ctx.arc(CX, CY, fr + fw / 2, 0, 6.2832); ctx.stroke();

  // axis glow
  const ag = Math.sin(t * 0.5) * 0.5 + 0.5;
  const grd = ctx.createLinearGradient(CX, 0, CX, H);
  grd.addColorStop(0, 'rgba(245,245,247,0)');
  grd.addColorStop(0.4, `rgba(245,245,247,${0.03 + ag * 0.04})`);
  grd.addColorStop(0.5, `rgba(245,245,247,${0.06 + ag * 0.06})`);
  grd.addColorStop(0.6, `rgba(245,245,247,${0.03 + ag * 0.04})`);
  grd.addColorStop(1, 'rgba(245,245,247,0)');
  ctx.fillStyle = grd; ctx.fillRect(CX - 30, 0, 60, H);

  // faint radial guides for alphabet positions
  const R = Math.min(W, H) * 0.5;
  ctx.strokeStyle = 'rgba(255,255,255,0.015)'; ctx.lineWidth = 0.3;
  for (let i = 0; i < 26; i++) {
    const a = (i / 26) * Math.PI * 2;
    ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(CX + Math.cos(a) * R, CY + Math.sin(a) * R); ctx.stroke();
  }

  for (const jt of joints) {
    ctx.strokeStyle = jointColor(jt.p, 0.05 + 0.08 * (jt.a.energy + jt.b.energy) / 2);
    ctx.lineWidth = jt.p > 0 ? 0.5 : 0.4;
    ctx.setLineDash(jt.p > 0 ? [] : [2, 5]);
    ctx.beginPath(); ctx.moveTo(jt.a.x, jt.a.y); ctx.lineTo(jt.b.x, jt.b.y); ctx.stroke();
    ctx.setLineDash([]);
  }

  for (const n of nodes) {
    const r = n.radius * n.life;
    if (r < 0.2) continue;
    let col;
    if (n.state === 'as') col = `rgba(59,130,246,${0.25 + 0.5 * n.life})`;
    else if (n.state === 'frontier') col = `rgba(212,168,83,${0.3 + 0.4 * n.life})`;
    else col = `rgba(224,106,58,${0.2 + 0.35 * n.life})`;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 6.2832); ctx.fill();
    if (n.state === 'frontier' && r > 1.2) {
      const pulse = Math.sin(t * 8 + n.phase) * 0.3 + 0.7;
      ctx.fillStyle = `rgba(212,168,83,${0.12 * pulse * n.life})`;
      ctx.beginPath(); ctx.arc(n.x, n.y, r * 1.8, 0, 6.2832); ctx.fill();
    }
  }

  document.getElementById('alive').textContent = nodes.length;
  document.getElementById('ascount').textContent = nodes.filter(n => n.state === 'as').length;
  document.getElementById('frcount').textContent = nodes.filter(n => n.state === 'frontier').length;
  document.getElementById('nascount').textContent = nodes.filter(n => n.state === 'not_as').length;
  document.getElementById('jtcount').textContent = joints.length;
}

function loop() { if (!REDUCE) step(); draw(); requestAnimationFrame(loop); }

// interaction
c.addEventListener('click', e => {
  const r = c.getBoundingClientRect();
  clickCharge = { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height, life: 1 };
  for (let i = 0; i < 3; i++) {
    const ch = String.fromCharCode(65 + Math.floor(Math.random() * 26));
    injectLetter(ch);
  }
});
c.addEventListener('contextmenu', e => {
  e.preventDefault();
  const r = c.getBoundingClientRect();
  const x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  for (let j = joints.length - 1; j >= 0; j--) {
    const { a, b } = joints[j];
    if (Math.hypot(x - (a.x + b.x) / 2, y - (a.y + b.y) / 2) < 60) joints.splice(j, 1);
  }
});
c.addEventListener('wheel', e => { e.preventDefault(); scrollTempo = Math.max(0.1, Math.min(2, scrollTempo - e.deltaY * 0.0008)); }, { passive: false });

// ══ LETTER ENGINE — injects nodes into the breath ecosystem ══

const headlineEl = document.getElementById('headline');
const subEl = document.getElementById('sub');

const LINES = [
  'THE FRAME IS THE ARCHITECTURE',
  'NOT A FRAMEWORK NOT A SYNTAX',
  'TWENTY SIX LETTERS IS ALL IT TAKES',
  'ONE GRID INFINITE ARRANGEMENTS',
  'THE LINE THAT BECOMES ITS OTHER',
  'POSITION IS THE ONLY VARIABLE',
  'WHERE CONSTRAINT MEETS COMPUTATION',
  'THE SEAM IS THE ONLY HONEST LINE',
];

let displayChars = [];

function renderText(chars) {
  headlineEl.textContent = chars.join('');
  // Inject only the LAST character added — not the entire array
  if (chars.length > 0) injectLetter(chars[chars.length - 1]);
}

// ── POEM ──
let poemLine = 0, poemChar = 0, poemTimer;
function runPoem() {
  clearInterval(poemTimer); displayChars = []; poemLine = 0; poemChar = 0;
  renderText([]); subEl.textContent = 'line 1/8';
  poemTimer = setInterval(() => {
    const line = LINES[poemLine];
    if (poemChar < line.length) { displayChars.push(line[poemChar]); poemChar++; renderText(displayChars); }
    else { poemLine = (poemLine + 1) % LINES.length; poemChar = 0; displayChars = []; renderText([]); subEl.textContent = 'line ' + (poemLine + 1) + '/8'; }
  }, 90);
}

// ── CLOCK ──
let clockTimer;
function runClock() { clearInterval(clockTimer); subEl.textContent = 'real-time';
  function tick() { const t = new Date().toTimeString().split(' ')[0].split(''); displayChars = t; renderText(t); }
  tick(); clockTimer = setInterval(tick, 1000);
}

// ── SCRAMBLE ──
let scrambleTimer;
function runScramble() { clearInterval(scrambleTimer);
  const phrase = LINES[Math.floor(Math.random() * LINES.length)].split('');
  const scrambled = [...phrase].sort(() => Math.random() - 0.5); subEl.textContent = 'decrypting';
  let revealIdx = 0; displayChars = scrambled; renderText(scrambled);
  scrambleTimer = setInterval(() => {
    if (revealIdx < phrase.length) { displayChars[revealIdx] = phrase[revealIdx]; revealIdx++; renderText(displayChars); }
    else { clearInterval(scrambleTimer); setTimeout(runScramble, 2000); }
  }, 200);
}

// ── TYPE ──
let onTypeKey;
function runType() { displayChars = []; renderText([]); subEl.textContent = 'start typing';
  document.addEventListener('keydown', onTypeKey = e => {
    if (e.key === 'Backspace') displayChars.pop();
    else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) displayChars.push(e.key.toUpperCase());
    else if (e.key === 'Enter') displayChars = [];
    renderText(displayChars);
  });
}
function stopType() { document.removeEventListener('keydown', onTypeKey); }

// ── CONTROLS ──
const modes = { poem: runPoem, clock: runClock, scramble: runScramble, type: runType };
document.querySelectorAll('#controls button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#controls button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active'); stopType();
    [poemTimer, clockTimer, scrambleTimer].forEach(t => clearInterval(t));
    modes[btn.dataset.mode]();
  });
});

// seed initial colony
for (let i = 0; i < 30; i++) {
  const ch = String.fromCharCode(65 + Math.floor(Math.random() * 26));
  injectLetter(ch);
}

requestAnimationFrame(loop);
runPoem();
</script>
</body>
</html>
