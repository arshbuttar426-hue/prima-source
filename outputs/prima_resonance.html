<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prima · Resonance</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#08080c;color:#f5f5f7;-webkit-font-smoothing:antialiased;font-weight:300;overflow:hidden;height:100vh;width:100vw;cursor:crosshair}
  #morph{position:fixed;inset:0;width:100%;height:100%}
  #hint{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:10;font-size:0.7rem;font-weight:300;color:rgba(255,255,255,0.2);letter-spacing:0.06em;pointer-events:none;transition:opacity 0.5s}
</style>
</head>
<body>

<canvas id="morph"></canvas>
<div id="hint">click — drop a pulse · right‑click — clear</div>

<script>
// ══ MORPH GRID — the proven engine ══
const C = { bg:'#08080c', blue:'#5a7aff', orange:'#e06a3a', gold:'#f5c451', ink:'#f5f5f7' };
const cv = document.getElementById('morph');
const ctx = cv.getContext('2d');
let DPR = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
let COLS = 26, ROWS = 15;
let nodes = [];
let mx = -9, my = -9, smx = -9;
let targetPhase = 0.5, phase = 0.5;

function buildNodes() {
  const padX = W * 0.06, padY = H * 0.22;
  const gw = (W - padX * 2) / (COLS - 1);
  const gh = (H - padY * 2) / (ROWS - 1);
  const fresh = nodes.length === 0;
  const next = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const tx = padX + c * gw, ty = padY + r * gh;
    if (fresh) next.push({ x: tx, y: ty, bx: tx, by: ty, c, r, bob: Math.random() * 6.28 });
    else { const old = nodes[r * COLS + c]; next.push({ x: old.x, y: old.y, bx: tx, by: ty, c, r, bob: old.bob }); }
  }
  nodes = next;
}

function weights(ph) {
  const b = 0.42;
  const w0 = Math.exp(-Math.pow((ph - 0) / b, 2));
  const w1 = Math.exp(-Math.pow((ph - 0.5) / b, 2));
  const w2 = Math.exp(-Math.pow((ph - 1) / b, 2));
  const s = w0 + w1 + w2 || 1;
  return [w0 / s, w1 / s, w2 / s];
}
function idx(c, r) { return r * COLS + c; }

// ══ PULSE SOURCES — transient constraints dropped into the field ══
let sources = [];
function addSource(x, y) {
  // a source carries a random tone; its ring crosses the field and resonates
  sources.push({ x, y, born: performance.now() * 0.001, speed: 0.6 + Math.random() * 0.5, tone: 4 + Math.random() * 8, life: 1.0, maxR: Math.hypot(W, H) * 0.6 });
}

function draw() {
  requestAnimationFrame(draw);
  if (!W) return;

  const t = performance.now() * 0.001;
  const tightness = Math.max(0.4, Math.min(1.4, 1280 / Math.max(W, 320)));
  const phaseEase = 0.04 + (tightness - 0.4) * 0.05;

  // Phase: cursor x when active, else autonomous drift; sources bias toward burst
  if (smx >= 0) targetPhase = smx / W;
  else targetPhase += (0.5 - targetPhase) * 0.015;
  const bias = Math.min(1, sources.length / 4);
  const effectivePhase = phase * (1 - bias) + 0.72 * bias;
  phase += (targetPhase - phase) * phaseEase;

  const [wA, wF, wN] = weights(effectivePhase);

  // Resonance per node: how much the ring "carries" the node's bob amplitude
  for (const n of nodes) {
    n.x += (n.bx - n.x) * 0.08;
    n.y += (n.by - n.y) * 0.08;

    // cursor push
    if (smx >= 0) {
      const dx = n.x - mx, dy = n.y - my, d = Math.sqrt(dx * dx + dy * dy);
      if (d < 120) { const f = (1 - d / 120) * 16; n.x += (dx / d) * f; n.y += (dy / d) * f; }
    }

    // resonance: sum of all ring impacts washing over this node
    let res = 0;
    for (const s of sources) {
      if (s.life <= 0) continue;
      const age = t - s.born;
      const d = Math.hypot(s.x - n.x, s.y - n.y);
      const delay = d / s.speed;                 // when the ring reaches this node
      const w = Math.exp(-Math.pow((age - delay) / s.tone, 2)); // Gaussian impact
      res += w * s.life;
    }

    const ox = n.x, oy = n.y;
    const base = 5 + res * 22;                    // resonance swells the bob
    n.x = ox + Math.sin(t * 0.6 + n.bob) * base;
    n.y = oy + Math.cos(t * 0.5 + n.bob) * base;
  }

  ctx.clearRect(0, 0, W, H);

  // Mode A — wave (blue)
  ctx.lineWidth = 1; ctx.strokeStyle = C.blue; ctx.globalAlpha = wA * 0.5;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS - 1; c++) {
    const a = nodes[idx(c, r)], b = nodes[idx(c + 1, r)];
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  // Mode F — lattice (gold)
  ctx.strokeStyle = C.gold; ctx.globalAlpha = wF * 0.4;
  for (let r = 0; r < ROWS - 1; r++) for (let c = 0; c < COLS - 1; c++) {
    const a = nodes[idx(c, r)], b = nodes[idx(c + 1, r + 1)];
    const a2 = nodes[idx(c + 1, r)], b2 = nodes[idx(c, r + 1)];
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(a2.x, a2.y); ctx.lineTo(b2.x, b2.y); ctx.stroke();
  }

  // Mode N — burst (orange) : spokes radiate toward the nearest source instead of center
  let anchor = { x: W / 2, y: H / 2 };
  if (sources.length) { const s = sources[sources.length - 1]; anchor = { x: s.x, y: s.y }; }
  ctx.strokeStyle = C.orange; ctx.globalAlpha = wN * 0.35;
  for (const n of nodes) {
    ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(anchor.x, anchor.y); ctx.stroke();
  }

  // Draw expanding rings + decay sources
  for (let i = sources.length - 1; i >= 0; i--) {
    const s = sources[i];
    s.life = Math.max(0, s.life - 0.0012);
    if (s.life <= 0) { sources.splice(i, 1); continue; }
    const age = t - s.born;
    const rad = age * s.speed;
    if (rad < s.maxR) {
      const pulse = Math.sin(t * 3) * 0.2 + 0.8;
      ctx.strokeStyle = `rgba(245,245,247,${0.10 * s.life * pulse})`;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(s.x, s.y, rad, 0, 6.2832); ctx.stroke();
    }
    // core
    ctx.fillStyle = `rgba(245,245,247,${0.6 * s.life})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, 2.5, 0, 6.2832); ctx.fill();
  }

  // nodes — resonate = gold + larger; state-dominant determines hue otherwise
  ctx.globalAlpha = 1;
  for (const n of nodes) {
    let res = 0;
    for (const s of sources) {
      if (s.life <= 0) continue;
      const age = t - s.born;
      const d = Math.hypot(s.x - n.x, s.y - n.y);
      res += Math.exp(-Math.pow((age - d / s.speed) / s.tone, 2)) * s.life;
    }
    const dominated = wA >= wF && wA >= wN ? 0 : (wN >= wF ? 2 : 1);
    const color = res > 0.12 ? C.gold : (dominated === 0 ? C.blue : (dominated === 2 ? C.orange : C.gold));
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(n.x, n.y, res > 0.12 ? 2.2 : 1.6, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;

  const hint = document.getElementById('hint');
  hint.style.opacity = sources.length > 0 ? '0' : '1';
}

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); buildNodes();
}

cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect();
  addSource((e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height);
});
cv.addEventListener('contextmenu', e => { e.preventDefault(); sources = []; });
document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; smx = mx; });
document.addEventListener('mouseleave', () => { smx = -9; });
document.addEventListener('touchmove', e => { smx = e.touches[0].clientX; });
window.addEventListener('resize', resize);
resize(); draw();
</script>
</body>
</html>
