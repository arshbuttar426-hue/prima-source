<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE LEDGER — the law is a table</title>
<style>
@layer tokens, base, layout, motion, platform;

@layer tokens{
  :root{
    --u:8px;
    --s-1:calc(var(--u)*1); --s-2:calc(var(--u)*2); --s-3:calc(var(--u)*3); --s-4:calc(var(--u)*5);
    --bg:#040404; --ink:#f5f5f7; --dim:#9a9aa2; --faint:rgba(255,255,255,0.24);
    --line:rgba(255,255,255,0.06); --line-soft:rgba(255,255,255,0.035);
    --t-xxs:clamp(0.62rem,0.56rem+0.2vw,0.72rem); --t-xs:clamp(0.74rem,0.64rem+0.3vw,0.84rem);
    --t-sm:clamp(0.85rem,0.75rem+0.34vw,0.96rem); --t-md:clamp(1rem,0.86rem+0.6vw,1.12rem);
    --t-lg:clamp(1.3rem,1rem+1.5vw,2rem);
    --ease-shutter:cubic-bezier(0.9,0,0.1,1); --ease-soft:cubic-bezier(0.22,0.61,0.36,1);
    --as:#3b82f6; --fr:#d4a853; --na:#e06a3a;
  }
}

@layer base{
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    font-size:var(--t-md);line-height:1.5;font-weight:400;height:100vh;overflow:hidden}
  ::selection{background:rgba(255,255,255,0.12)}
}

@layer layout{
  canvas{position:fixed;left:0;top:0;bottom:0;width:52%;z-index:0}
  #axis{position:fixed;left:52%;top:0;bottom:0;width:1px;background:var(--line);z-index:1;pointer-events:none}
  #axis::after{content:"⌁";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--faint);font-size:11px}

  #panel{position:fixed;right:0;top:0;bottom:0;width:48%;z-index:2;display:flex;flex-direction:column;
    border-left:1px solid var(--line-soft);background:rgba(4,4,4,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  #panel .head{padding:var(--s-3) var(--s-3) var(--s-2);border-bottom:1px solid var(--line-soft);display:flex;align-items:baseline;gap:var(--s-2)}
  #panel .head .title{font-size:var(--t-xs);font-weight:600;letter-spacing:0.18em;text-transform:uppercase}
  #panel .head .sub{font-size:var(--t-xxs);color:var(--dim);letter-spacing:0.05em}
  #panel .head .ctrl{margin-left:auto;display:flex;gap:var(--s-1)}
  #panel .head button{font-family:inherit;background:rgba(255,255,255,0.04);border:1px solid var(--line);color:var(--dim);
    font-size:var(--t-xxs);letter-spacing:0.08em;padding:4px 10px;border-radius:100px;cursor:pointer;transition:all .2s var(--ease-soft)}
  #panel .head button:hover{color:var(--ink);border-color:var(--faint)}
  #panel .head button.on{color:var(--ink);border-color:var(--ink)}

  #wrap{flex:1;overflow-y:auto;padding:var(--s-2) var(--s-3)}
  #wrap::-webkit-scrollbar{width:4px}
  #wrap::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}

  table{width:100%;border-collapse:collapse;font-size:var(--t-xs)}
  thead th{position:sticky;top:0;background:#060606;font-size:var(--t-xxs);font-weight:500;letter-spacing:0.12em;
    text-transform:uppercase;color:var(--dim);padding:var(--s-1);text-align:left;border-bottom:1px solid var(--line-soft);z-index:2}
  thead th.num{text-align:right}
  tbody td{padding:var(--s-1);border-bottom:1px solid var(--line-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
  td.id{color:var(--faint);font-family:'SF Mono','Menlo',monospace;font-size:var(--t-xxs)}
  td.nm{text-align:right;color:var(--dim)}
  td.en{text-align:right;color:var(--ink)}
  .cell{cursor:pointer;text-align:center;border-radius:4px;padding:3px 6px;font-size:var(--t-xxs);transition:all .25s var(--ease-soft);
    opacity:0.3;user-select:none}
  .cell:hover{opacity:1}
  .cell.as{background:rgba(59,130,246,0.85);color:#fff}
  .cell.fr{background:rgba(212,168,83,0.85);color:#1a1405}
  .cell.na{background:rgba(224,106,58,0.85);color:#fff}
  .cell.off{background:rgba(255,255,255,0.06);color:var(--faint)}

  .foot{padding:var(--s-2) var(--s-3);border-top:1px solid var(--line-soft);font-size:var(--t-xxs);color:var(--faint);
    display:flex;gap:var(--s-3);letter-spacing:0.06em;flex-wrap:wrap}
  .foot .k{color:var(--dim)}
  .foot .v{color:var(--ink);font-variant-numeric:tabular-nums}

  @media(max-width:720px){
    canvas{position:fixed;inset:0;width:100%;height:42vh;top:0;bottom:auto}
    #axis{display:none}
    #panel{top:42vh;bottom:0;width:100%;border-top:1px solid var(--line-soft)}
  }
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="axis"></div>

<div id="panel">
  <div class="head">
    <div class="title">The Ledger</div>
    <div class="sub">the law is a table</div>
    <div class="ctrl">
      <button id="flowBtn" class="on">FLOW</button>
      <button id="polBtn">RE-SIGN</button>
      <button id="resetBtn">RESET</button>
    </div>
  </div>
  <div id="wrap">
    <table>
      <thead><tr>
        <th>#</th><th>law</th><th class="num" style="text-align:center">energy</th><th class="num" style="text-align:center">signal</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="foot">
    <div><span class="k">as</span> <span class="v" id="asCount">0</span></div>
    <div><span class="k">fr</span> <span class="v" id="frCount">0</span></div>
    <div><span class="k">not_as</span> <span class="v" id="naCount">0</span></div>
    <div style="margin-left:auto"><span class="v" id="total">0</span> <span class="k">atoms</span></div>
  </div>
</div>

<script>
const REDUCE=matchMedia('(prefers-reduced-motion:reduce)').matches;
const c=document.getElementById('c'),ctx=c.getContext('2d');
const DPR=Math.min(devicePixelRatio||1,2);
let W=0,H=0;

function resize(){
  W=innerWidth*0.52;H=innerHeight;
  c.style.width='52%';c.style.left='0';
  c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize();addEventListener('resize',resize);

const CNT=24;
const nodes=[];
for(let i=0;i<CNT;i++){
  nodes.push({
    id:i,
    x:W*0.3+Math.cos(i/CNT*Math.PI*2)*(W*0.18)*Math.random(),
    y:H*0.5+Math.sin(i/CNT*Math.PI*2)*(H*0.28),
    vx:0,vy:0,
    law:Math.random()<0.4?'as':Math.random()<0.5?'fr':'na',
    energy:Math.random(),
    phase:Math.random()*Math.PI*2
  });
}
// seam anchor — left field is constrained to mirror the table
let joints=[];
let flow=true;

function lawPolarity(n1,n2){
  if(n1.law==='na'||n2.law==='na')return -1;
  if(n1.law==='fr'||n2.law==='fr')return 0;
  return 1;
}

function rebuildJoints(){
  joints=[];
  for(let i=0;i<CNT;i++){
    for(let k=i+1;k<CNT;k++){
      const a=nodes[i],b=nodes[k];
      const d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<120){
        const p=lawPolarity(a,b);
        joints.push({a,b,p,active:true,squelch:p===0});
      }
    }
  }
}

function step(){
  const t=Date.now()*0.001;
  const tmp=Array(CNT).fill(0);
  for(const jt of joints){
    const sig=jt.a.energy*(jt.squelch?0:jt.p);
    tmp[jt.a.id]+=jt.b.energy*(jt.squelch?0:jt.p);
    tmp[jt.b.id]+=sig;
  }
  for(const n of nodes){
    const prev=n.energy;
    n.energy=Math.max(0,Math.min(1,prev*0.84+tmp[n.id]*0.02+0.01));
    // ambient source: as nodes kept alive by their own law
    if(n.law==='as')n.energy=Math.max(n.energy,0.35+0.15*Math.sin(t*1.2+n.phase));
    if(n.law==='na')n.energy=Math.min(n.energy,0.6);
  }
  // gentle motion
  for(const n of nodes){
    n.vx=(n.vx+(Math.random()-0.5)*0.3)*0.9;
    n.vy=(n.vy+(Math.random()-0.5)*0.3)*0.9;
    n.x+=n.vx;n.y+=n.vy;
    n.x=Math.max(20,Math.min(W-20,n.x));
    n.y=Math.max(20,Math.min(H-20,n.y));
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // field glow
  const grd=ctx.createRadialGradient(W*0.5,H*0.5,0,W*0.5,H*0.5,W*0.6);
  grd.addColorStop(0,'rgba(255,255,255,0.03)');grd.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);

  // joints
  for(const jt of joints){
    const alpha=0.03+0.07*(jt.a.energy+jt.b.energy)/2;
    let col;
    if(jt.squelch)col=`rgba(212,168,83,${alpha*0.6})`;
    else col=jt.p>0?`rgba(59,130,246,${alpha})`:`rgba(224,106,58,${alpha})`;
    ctx.strokeStyle=col;ctx.lineWidth=jt.squelch?0.4:0.6;
    ctx.setLineDash(jt.squelch?[3,4]:(jt.p>0?[]:[2,5]));
    ctx.beginPath();ctx.moveTo(jt.a.x,jt.a.y);ctx.lineTo(jt.b.x,jt.b.y);ctx.stroke();
    ctx.setLineDash([]);
  }

  // nodes
  const t=Date.now()*0.001;
  for(const n of nodes){
    const r=2.2+n.energy*3.4+(n.law==='as'?Math.sin(t*2+n.phase)*0.5:0);
    const col=n.law==='as'?`rgba(59,130,246,${0.3+0.55*n.energy})`
             :n.law==='fr'?`rgba(212,168,83,${0.35+0.4*n.energy})`
             :`rgba(224,106,58,${0.25+0.4*n.energy})`;
    ctx.fillStyle=col;
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,6.2832);ctx.fill();
    if(n.law==='fr'){
      ctx.strokeStyle=`rgba(212,168,83,${0.15+0.1*Math.sin(t*6+n.phase)})`;
      ctx.lineWidth=0.5;
      ctx.beginPath();ctx.arc(n.x,n.y,r*1.6,0,6.2832);ctx.stroke();
    }
  }
}

function renderTable(){
  const tbody=document.getElementById('rows');
  tbody.innerHTML='';
  let ac=0,fc=0,nc=0;
  nodes.forEach(n=>{
    const tr=document.createElement('tr');
    const tdId=document.createElement('td');tdId.className='id';tdId.textContent=n.id;
    const tdLaw=document.createElement('td');
    const cell=document.createElement('span');
    cell.className='cell '+n.law;
    cell.textContent=n.law==='as'?'AS':n.law==='fr'?'FR':'NOT_AS';
    cell.onclick=()=>{cycleLaw(n);rebuildJoints();renderTable();};
    tdLaw.appendChild(cell);
    const tdEn=document.createElement('td');tdEn.className='en';tdEn.textContent=n.energy.toFixed(2);
    const tdSig=document.createElement('td');tdSig.className='nm';tdSig.textContent=sigOf(n).toFixed(2);
    tr.appendChild(tdId);tr.appendChild(tdLaw);tr.appendChild(tdEn);tr.appendChild(tdSig);
    tbody.appendChild(tr);
    if(n.law==='as')ac++;else if(n.law==='fr')fc++;else nc++;
  });
  document.getElementById('asCount').textContent=ac;
  document.getElementById('frCount').textContent=fc;
  document.getElementById('naCount').textContent=nc;
  document.getElementById('total').textContent=nodes.length;
}

function sigOf(n){
  let s=0;
  for(const jt of joints){
    if(jt.squelch)continue;
    if(jt.a.id===n.id)s+=jt.b.energy*jt.p;
    else if(jt.b.id===n.id)s+=jt.a.energy*jt.p;
  }
  return s;
}

function cycleLaw(n){
  const order=['as','fr','na'];
  n.law=order[(order.indexOf(n.law)+1)%order.length];
}

function loop(){
  if(!REDUCE)step();
  draw();
  if(!REDUCE)requestAnimationFrame(loop);
}

// controls
document.getElementById('flowBtn').addEventListener('click',b=>{flow=!flow;b.classList.toggle('on',flow);});
document.getElementById('polBtn').addEventListener('click',()=>{
  joints.forEach(jt=>{if(!jt.squelch)jt.p=Math.random()<0.5?1:-1});
  renderTable();
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  nodes.forEach((n,i)=>{n.law=i%3===0?'as':i%3===1?'fr':'na';n.energy=0.5});
  rebuildJoints();renderTable();
});

// click field to seed energy at a node
c.addEventListener('click',e=>{
  const r=c.getBoundingClientRect();
  const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  let best=0,bd=1e9;
  for(const n of nodes){const d=Math.hypot(x-n.x,y-n.y);if(d<bd){bd=d;best=n.id}}
  nodes[best].energy=1;
});

rebuildJoints();
renderTable();
if(REDUCE)loop();else requestAnimationFrame(loop);
// refresh live numbers
setInterval(()=>{
  if(!flow)return;
  const tbody=document.getElementById('rows');
  const rows=tbody.children;
  for(let i=0;i<rows.length;i++){
    const n=nodes[i];
    rows[i].children[2].textContent=n.energy.toFixed(2);
    rows[i].children[3].textContent=sigOf(n).toFixed(2);
  }
  let ac=0,fc=0,nc=0;
  nodes.forEach(n=>{if(n.law==='as')ac++;else if(n.law==='fr')fc++;else nc++});
  document.getElementById('asCount').textContent=ac;
  document.getElementById('frCount').textContent=fc;
  document.getElementById('naCount').textContent=nc;
},500);
</script>
</body>
</html>
