<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prima · Layout Engine</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Charter","Georgia","Times New Roman",serif;background:#0a0a0a;color:#f5f5f7;-webkit-font-smoothing:antialiased;font-weight:400;line-height:1.618;min-height:100vh}
  #page{max-width:var(--col-width, 36rem);margin:0 auto;padding:var(--pad-y, 5rem) var(--pad-x, 2rem) 8rem}

  /* ── ARCHETYPES ── */
  body.poem #page{max-width:28rem;padding-top:12vh}
  body.poem .block{font-size:var(--size, 1.8rem);font-weight:200;line-height:1.35;letter-spacing:-0.015em;margin-bottom:0.3em}
  body.poem .block br{display:block;content:"";margin-bottom:0.15em}

  body.essay #page{max-width:38rem}
  body.essay .block{font-size:1.15rem;line-height:1.75;margin-bottom:1.4em;color:#d0d0d6}
  body.essay .block.h1{font-size:2.2rem;font-weight:200;line-height:1.15;color:#f5f5f7;margin-bottom:0.5em}
  body.essay .block.pull{font-size:1.4rem;font-weight:300;line-height:1.4;color:#f5f5f7;margin:2.5rem 0;padding-left:1px;border-left:2px solid rgba(255,255,255,0.4);padding:0 0 0 1.5rem}

  body.list .block{font-size:1.05rem;line-height:1.5;margin-bottom:0.3em;padding:0.8rem 1rem;border-left:3px solid rgba(255,255,255,0.06);transition:border-color 0.2s}
  body.list .block:hover{border-left-color:rgba(255,255,255,0.2)}
  body.list .block.h1{font-size:1.6rem;font-weight:300;border:none;padding:0;margin:2.5rem 0 1rem}

  body.dialogue .block{font-size:1rem;line-height:1.55;margin-bottom:0.6em;padding-left:1.5rem}
  body.dialogue .block.a{text-align:left;color:#f5f5f7;padding-right:3rem}
  body.dialogue .block.b{text-align:right;font-style:italic;color:#a0a0a8;padding-left:3rem;padding-right:0}
  body.dialogue .block.dir{text-align:center;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.15em;color:#5a5a62;padding:1rem 0}

  body.product #page{max-width:32rem;padding-top:20vh;text-align:center}
  body.product .block.h1{font-size:3rem;font-weight:200;line-height:1.08;letter-spacing:-0.03em;margin-bottom:1.2rem}
  body.product .block{font-size:1.1rem;line-height:1.55;color:#9a9aa2;margin-bottom:2rem}

  body.code #page{max-width:none;padding:2rem}
  body.code .block{font-family:"SF Mono","Menlo","Consolas",monospace;font-size:0.85rem;line-height:1.7;white-space:pre-wrap;color:#c0c0c8;background:rgba(255,255,255,0.02);padding:1rem 1.5rem;border-radius:6px;margin-bottom:0.15rem}

  body.numbers #page{max-width:48rem;padding-top:8vh}
  body.numbers .block{display:flex;align-items:baseline;gap:1rem;margin-bottom:0.4rem;padding:0.6rem 0;border-bottom:1px solid rgba(255,255,255,0.04)}
  body.numbers .block .num{font-size:1.6rem;font-weight:300;font-variant-numeric:tabular-nums;min-width:5rem}
  body.numbers .block .lbl{font-size:0.8rem;color:#9a9aa2;text-transform:uppercase;letter-spacing:0.06em}
  body.numbers .block .bar{flex:1;height:2px;background:rgba(255,255,255,0.08);position:relative}
  body.numbers .block .bar::after{content:"";position:absolute;left:0;top:0;height:100%;background:rgba(255,255,255,0.3);width:var(--bar-pct, 50%)}

  /* ── Editor ── */
  #editor{max-width:var(--col-width, 36rem);margin:0 auto;padding:0 var(--pad-x, 2rem) 3rem}
  #editor textarea{width:100%;min-height:6rem;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:6px;color:#f5f5f7;font-family:inherit;font-size:0.82rem;line-height:1.6;padding:1rem;resize:vertical;outline:none}
  #editor textarea:focus{border-color:rgba(255,255,255,0.18)}
  #editor textarea::placeholder{color:rgba(255,255,255,0.15)}
  #editor .bar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  #editor .label{font-size:0.6rem;text-transform:uppercase;letter-spacing:0.1em;color:rgba(255,255,255,0.25)}
  #editor button{padding:5px 12px;background:none;border:1px solid rgba(255,255,255,0.1);border-radius:5px;color:rgba(255,255,255,0.35);font-family:inherit;font-size:0.65rem;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer}
  #editor button:hover{border-color:rgba(255,255,255,0.3);color:#f5f5f7}

  @media(max-width:600px){#page{padding:3rem 1.2rem 6rem}#editor{padding:0 1.2rem 2rem}}
</style>
</head>
<body>
<div id="page"></div>
<div id="editor">
  <textarea id="input" placeholder="Paste any text. The engine decides the layout."></textarea>
  <div class="bar">
    <span class="label" id="archetype-label">poem</span>
    <div style="display:flex;gap:6px">
      <button id="btn-poem">Poem</button>
      <button id="btn-essay">Essay</button>
      <button id="btn-list">List</button>
      <button id="btn-dialogue">Dialogue</button>
      <button id="btn-code">Code</button>
    </div>
  </div>
</div>

<script>
const pageEl = document.getElementById('page');
const inputEl = document.getElementById('input');
const labelEl = document.getElementById('archetype-label');

function classify(text) {
  if (!text.trim()) return 'poem';
  const lines = text.split('\n').filter(l => l.trim().length > 0);
  const allLines = text.split('\n');
  const words = text.match(/\S+/g) || [];
  const avgLineLen = text.replace(/\s/g, '').length / Math.max(1, lines.length);
  const emptyLines = allLines.filter(l => l.trim().length === 0).length;
  const emptyRatio = emptyLines / Math.max(1, allLines.length);
  const dialoguePattern = lines.filter(l => /^[A-Z][a-z]+:/.test(l.trim())).length;
  const codePattern = lines.filter(l => /[{}\[\]();=><]/.test(l) || /^\s{2,}/.test(l) || /function|const |let |var |import |export /.test(l)).length;
  const bulletPattern = lines.filter(l => /^[-•*#]\s/.test(l.trim())).length;
  const numberPattern = lines.filter(l => /^\d+[\.\)]\s/.test(l.trim()) || /^\d+/.test(l.trim()) && /[\d.,%]+$/.test(l.trim())).length;

  if (codePattern > lines.length * 0.3) return 'code';
  if (dialoguePattern > lines.length * 0.4) return 'dialogue';
  if (bulletPattern > lines.length * 0.2 || numberPattern > lines.length * 0.3) return 'list';
  if (avgLineLen < 40 && lines.length > 4 && emptyRatio < 0.1) return 'poem';
  if (emptyRatio > 0.15 && avgLineLen > 40 && lines.length > 6) return 'essay';
  if (lines.length <= 4 && words.length < 40) return 'product';
  if (avgLineLen > 60) return 'essay';
  return 'list';
}

function render(text, forceArchetype) {
  document.body.className = '';
  const archetype = forceArchetype || classify(text);
  document.body.classList.add(archetype);
  labelEl.textContent = archetype;
  pageEl.innerHTML = '';

  const lines = text.split('\n');
  if (archetype === 'poem') {
    for (const line of lines) {
      if (!line.trim()) { pageEl.appendChild(document.createElement('br')); continue; }
      const div = document.createElement('div'); div.className = 'block'; div.textContent = line; pageEl.appendChild(div);
    }
  } else if (archetype === 'essay') {
    let first = true;
    for (const line of lines) {
      const trimmed = line.trim();
      if (!trimmed) continue;
      const div = document.createElement('div');
      if (first) { div.className = 'block h1'; first = false; } else { div.className = 'block'; }
      div.textContent = trimmed; pageEl.appendChild(div);
    }
  } else if (archetype === 'list') {
    let lastEmpty = false;
    for (const line of lines) {
      const trimmed = line.trim();
      if (!trimmed) { lastEmpty = true; continue; }
      const div = document.createElement('div');
      div.className = lastEmpty ? 'block h1' : 'block';
      div.textContent = trimmed.replace(/^[-•*#]\s*/, '');
      pageEl.appendChild(div);
      lastEmpty = false;
    }
  } else if (archetype === 'dialogue') {
    for (const line of lines) {
      const trimmed = line.trim(); if (!trimmed) continue;
      const div = document.createElement('div');
      const m = trimmed.match(/^([A-Z][a-z]+):\s*(.+)/);
      if (m) { div.className = 'block ' + (m[1] === 'A' || m[1].length <= 3 ? 'a' : 'b'); div.textContent = m[2]; }
      else if (/^\(.+\)$/.test(trimmed)) { div.className = 'block dir'; div.textContent = trimmed.replace(/[()]/g, ''); }
      else { div.className = 'block a'; div.textContent = trimmed; }
      pageEl.appendChild(div);
    }
  } else if (archetype === 'product') {
    for (const line of lines) {
      const trimmed = line.trim(); if (!trimmed) continue;
      const div = document.createElement('div');
      div.className = lines.indexOf(line) === 0 ? 'block h1' : 'block';
      div.textContent = trimmed; pageEl.appendChild(div);
    }
  } else if (archetype === 'code') {
    const div = document.createElement('div'); div.className = 'block'; div.textContent = text; pageEl.appendChild(div);
  } else {
    for (const line of lines) {
      if (!line.trim()) continue;
      const div = document.createElement('div'); div.className = 'block'; div.textContent = line; pageEl.appendChild(div);
    }
  }
}

inputEl.addEventListener('input', () => render(inputEl.value));
document.getElementById('btn-poem').addEventListener('click', () => render(inputEl.value, 'poem'));
document.getElementById('btn-essay').addEventListener('click', () => render(inputEl.value, 'essay'));
document.getElementById('btn-list').addEventListener('click', () => render(inputEl.value, 'list'));
document.getElementById('btn-dialogue').addEventListener('click', () => render(inputEl.value, 'dialogue'));
document.getElementById('btn-code').addEventListener('click', () => render(inputEl.value, 'code'));

// Seed with a poem
const seed = `The frame is the architecture.\nNot a framework. Not a syntax.\nTwenty-six letters is all it takes.\nOne grid. Infinite arrangements.\nThe line that becomes its other.\nPosition is the only variable.`;
inputEl.value = seed;
render(seed);
</script>
</body>
</html>
