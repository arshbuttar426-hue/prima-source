<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake — as / not_as</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #07080a; overflow: hidden; height: 100vh; cursor: none;
    font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; user-select: none;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; }

  .hud {
    position: fixed; top: 28px; left: 50%; transform: translateX(-50%);
    z-index: 5; display: flex; gap: 28px; align-items: center;
    pointer-events: none;
    background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.04); border-radius: 14px;
    padding: 8px 24px; transition: opacity 0.4s;
  }
  .hud .stat { display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .hud .stat .label { font-size: 0.5rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; }
  .hud .stat .label.s1 { color: rgba(100,200,240,0.5); }
  .hud .stat .label.s2 { color: rgba(255,200,60,0.4); }
  .hud .stat .label.s3 { color: rgba(200,150,255,0.4); }
  .hud .stat .val { font-size: 1.2rem; font-weight: 200; letter-spacing: -0.02em; line-height: 1.2; }
  .hud .stat .val.v1 { color: rgba(100,200,240,0.85); }
  .hud .stat .val.v2 { color: rgba(255,200,60,0.7); }
  .hud .stat .val.v3 { color: rgba(200,150,255,0.7); }

  .score-popup {
    position: fixed; z-index: 8; pointer-events: none;
    font-size: 1.4rem; font-weight: 200; letter-spacing: -0.02em;
    color: rgba(255,220,120,0.8); text-shadow: 0 0 40px rgba(255,200,60,0.3);
    animation: popUp 1s ease-out forwards;
  }
  @keyframes popUp {
    0% { opacity: 1; transform: translateY(0) scale(0.5); }
    40% { opacity: 1; transform: translateY(-25px) scale(1.1); }
    100% { opacity: 0; transform: translateY(-70px) scale(0.8); }
  }

  .overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 20; display: flex; align-items: center; justify-content: center;
    background: rgba(7,8,10,0.75); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    opacity: 0; pointer-events: none; transition: opacity 0.6s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay-inner { text-align: center; transform: translateY(10px); transition: transform 0.6s cubic-bezier(0.22,1,0.36,1); }
  .overlay.show .overlay-inner { transform: translateY(0); }
  .overlay h2 {
    font-size: 2.2rem; font-weight: 200; letter-spacing: -0.03em;
    background: linear-gradient(135deg, rgba(100,200,240,0.9), rgba(200,150,255,0.6));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 6px;
  }
  .overlay p { font-size: 0.82rem; font-weight: 300; color: rgba(255,255,255,0.3); margin-bottom: 24px; letter-spacing: 0.02em; }
  .overlay .btn {
    font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 400;
    padding: 9px 32px; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.6);
    border-radius: 100px; cursor: pointer; letter-spacing: 0.05em;
    transition: all 0.25s; backdrop-filter: blur(10px);
  }
  .overlay .btn:hover { background: rgba(100,200,240,0.1); border-color: rgba(100,200,240,0.2); color: rgba(255,255,255,0.85); }

  @media (max-width: 640px) {
    .hud { top: 12px; gap: 12px; padding: 6px 14px; }
    .hud .stat .val { font-size: 0.95rem; }
    .overlay h2 { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="hud" id="hud">
  <div class="stat"><span class="label s1">Score</span><span class="val v1" id="score">0</span></div>
  <div class="stat"><span class="label s2">Best</span><span class="val v2" id="best">0</span></div>
  <div class="stat"><span class="label s3">Length</span><span class="val v3" id="len">8</span></div>
</div>

<div class="overlay show" id="startOverlay">
  <div class="overlay-inner">
    <h2>snake</h2>
    <p>move your cursor. eat the light.</p>
    <button class="btn" id="startBtn">play</button>
  </div>
</div>

<div class="overlay" id="gameOverOverlay">
  <div class="overlay-inner">
    <h2>coiled</h2>
    <p id="finalScore" style="color:rgba(255,255,255,0.3);">score: 0 · length: 0</p>
    <p id="bestScore" style="font-size:0.72rem;color:rgba(255,200,60,0.4);margin-top:-18px;margin-bottom:24px;">best: 0</p>
    <button class="btn" id="retryBtn">play again</button>
  </div>
</div>

<script>
// ─── Canvas ───
const c = document.getElementById('c'), ctx = c.getContext('2d');
let W, H;

function resize() { W = c.width = window.innerWidth; H = c.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

// ─── Input ───
let mx = W / 2, my = H / 2;
document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
document.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  mx = t.clientX;
  my = t.clientY;
}, { passive: false });

// ─── not_as atoms ───
const not_as = {
  headDir: (mx, my, hx, hy) => {
    const dx = mx - hx, dy = my - hy, d = Math.hypot(dx, dy) || 1;
    return { x: dx / d, y: dy / d };
  },
  headMove: (hx, hy, dir, speed) => ({ x: hx + dir.x * speed, y: hy + dir.y * speed }),
  // Rigid distance constraint: follower is placed EXACTLY `gap` from leader
  // No lerp — prevents bunching in tight turns
  constrain: (lx, ly, fx, fy, gap) => {
    const dx = fx - lx, dy = fy - ly, d = Math.hypot(dx, dy) || 1;
    if (d <= gap) return { x: fx, y: fy };
    const r = gap / d;
    return { x: lx + dx * r, y: ly + dy * r };
  },
  dist2: (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by),
  boundsDeath: (hx, hy) => hx < -5 || hx > W + 5 || hy < -5 || hy > H + 5,
  selfDeath: (head, body, gapSq) => {
    for (let i = 4; i < body.length; i++) {
      if ((head.x - body[i].x) * (head.x - body[i].x) + (head.y - body[i].y) * (head.y - body[i].y) < gapSq) return true;
    }
    return false;
  },
  fruitEaten: (hx, hy, fx, fy) => (hx - fx) * (hx - fx) + (hy - fy) * (hy - fy) < 2500,
  speedForLen: len => Math.min(5, 3 + len * 0.006),
  gapForLen: len => Math.max(5, 11 - len * 0.006),
};

// ─── Stars ───
const stars = [];
for (let i = 0; i < 100; i++) {
  stars.push({ x: Math.random() * W, y: Math.random() * H, r: 0.3 + Math.random() * 1.2, a: 0.1 + Math.random() * 0.3, s: 0.02 + Math.random() * 0.05, ph: Math.random() * Math.PI * 2 });
}

// ─── State ───
const state = {
  snake: [], targetLen: 8, segGap: 11, speed: 3,
  fruit: null, fruitLife: 0, fruitMax: 480,
  score: 0, best: parseInt(localStorage.getItem('snakeNeonBest') || '0'),
  playing: false, dead: false,
  particles: [], deathParticles: [],
  flash: 0, shake: 0, frame: 0,
  ambient: [],
};

// Ambient floaters
for (let i = 0; i < 20; i++) {
  state.ambient.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - 0.5) * 0.15, vy: -Math.random() * 0.2 - 0.03, r: 5 + Math.random() * 18, a: 0.02 + Math.random() * 0.03, ph: Math.random() * Math.PI * 2 });
}

// ─── Init ───
function initSnake() {
  state.snake = [];
  const gap = not_as.gapForLen(8);
  for (let i = 0; i < 8; i++) {
    state.snake.push({ x: W / 2 - i * gap * 0.3, y: H / 2 });
  }
  state.targetLen = 8;
  state.segGap = gap;
  state.speed = not_as.speedForLen(8);
}

function spawnFruit() {
  const m = 80;
  state.fruit = { x: m + Math.random() * (W - m * 2), y: m + Math.random() * (H - m * 2), life: state.fruitMax, pulse: Math.random() * Math.PI * 2 };
}

function burst(x, y, n, hue) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 7;
    state.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 30 + Math.random() * 25, sz: 1.5 + Math.random() * 3.5, hue: hue || 190 + Math.random() * 40 });
  }
}

function deathBurst() {
  const h = state.snake[0];
  for (let i = 0; i < 60; i++) {
    const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 10;
    const t = i / 60;
    state.deathParticles.push({ x: h.x, y: h.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 40 + Math.random() * 30, sz: 1 + Math.random() * 4, hue: t < 0.5 ? 190 + Math.random() * 30 : 280 + Math.random() * 40 });
  }
}

function scorePopup(pts, x, y) {
  const el = document.createElement('div');
  el.className = 'score-popup';
  el.textContent = '+' + pts;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

// ─── as pipeline ───
function pipeline() {
  if (!state.playing || state.dead) return;
  state.frame++;

  const len = state.snake.length;
  state.speed = not_as.speedForLen(len);
  state.segGap = not_as.gapForLen(len);

  // Head: follow cursor directly (no inertia)
  const dir = not_as.headDir(mx, my, state.snake[0].x, state.snake[0].y);
  const head = not_as.headMove(state.snake[0].x, state.snake[0].y, dir, state.speed);

  // Body: rigid distance constraints
  const newSnake = [head];
  for (let i = 1; i < state.snake.length; i++) {
    const l = newSnake[i - 1];
    const seg = not_as.constrain(l.x, l.y, state.snake[i].x, state.snake[i].y, state.segGap);
    newSnake.push(seg);
  }
  state.snake = newSnake;

  // Death
  if (not_as.boundsDeath(head.x, head.y) || not_as.selfDeath(head, state.snake, state.segGap * state.segGap * 0.5)) {
    state.dead = true;
    state.shake = 1;
    deathBurst();
    return;
  }

  // Fruit
  state.fruit.life--;
  if (state.fruit.life <= 0) { spawnFruit(); return; }
  if (not_as.fruitEaten(head.x, head.y, state.fruit.x, state.fruit.y)) {
    const bonus = Math.max(1, Math.floor(state.fruit.life / 60));
    state.score += bonus;
    state.targetLen += 3 + bonus;
    burst(state.fruit.x, state.fruit.y, 30 + bonus * 5);
    state.flash = 0.6;
    state.shake = 0.2;
    scorePopup(bonus, state.fruit.x - 15, state.fruit.y - 15);
    spawnFruit();
    return;
  }

  // Grow
  while (state.snake.length < state.targetLen) {
    const t = state.snake[state.snake.length - 1];
    state.snake.push({ x: t.x, y: t.y });
  }
  if (state.snake.length > state.targetLen) state.snake.splice(state.targetLen);

  // Particles
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.94; p.vy *= 0.94;
    p.life--;
    if (p.life <= 0) state.particles.splice(i, 1);
  }
  for (let i = state.deathParticles.length - 1; i >= 0; i--) {
    const p = state.deathParticles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life--;
    if (p.life <= 0) state.deathParticles.splice(i, 1);
  }
  state.flash *= 0.88;
  state.shake *= 0.92;

  if (state.score > state.best) { state.best = state.score; localStorage.setItem('snakeNeonBest', state.best); }
  document.getElementById('score').textContent = state.score;
  document.getElementById('best').textContent = state.best;
  document.getElementById('len').textContent = state.snake.length;
}

// ─── Draw ───
function draw() {
  // Background
  const t = Date.now() * 0.00015;
  const bg = ctx.createRadialGradient(W * (0.5 + Math.sin(t * 0.3) * 0.15), H * (0.4 + Math.cos(t * 0.2) * 0.1), 0, W * 0.5, H * 0.5, Math.hypot(W, H) * 0.7);
  bg.addColorStop(0, '#0f1520'); bg.addColorStop(0.3, '#0a0e14'); bg.addColorStop(0.6, '#080a0f'); bg.addColorStop(1, '#050608');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Nebula
  for (let n = 0; n < 3; n++) {
    const nx = W * (0.2 + n * 0.25 + Math.sin(t * 0.7 + n * 1.5) * 0.08);
    const ny = H * (0.3 + Math.cos(t * 0.5 + n * 2) * 0.12);
    const nr = 150 + n * 50 + Math.sin(t * 0.3 + n) * 25;
    const g = ctx.createRadialGradient(nx, ny, 0, nx, ny, nr);
    const hues = [210, 260, 180];
    g.addColorStop(0, `hsla(${hues[n]}, 25%, 12%, ${0.03 + 0.02 * Math.sin(t + n)})`);
    g.addColorStop(1, 'hsla(0,0%,0%,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(nx, ny, nr, 0, Math.PI * 2); ctx.fill();
  }

  // Stars
  for (const s of stars) {
    const tw = 0.5 + 0.5 * Math.sin(t * s.s * 8 + s.ph);
    ctx.beginPath(); ctx.arc(s.x + Math.sin(t * s.s + s.ph) * 0.5, s.y + Math.cos(t * s.s * 0.7 + s.ph) * 0.5, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(180,200,230,${s.a * tw})`; ctx.fill();
  }

  // Ambient
  for (const a of state.ambient) {
    a.x += a.vx; a.y += a.vy;
    if (a.y < -30) { a.y = H + 30; a.x = Math.random() * W; }
    if (a.x < -30) a.x = W + 30; if (a.x > W + 30) a.x = -30;
    ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(210,20%,80%,${a.a * (0.5 + 0.5 * Math.sin(t * 0.5 + a.ph))})`; ctx.fill();
  }

  if (!state.playing && !state.dead) return;

  // Shake
  const sx = state.shake > 0.01 ? (Math.random() - 0.5) * state.shake * 30 : 0;
  const sy = state.shake > 0.01 ? (Math.random() - 0.5) * state.shake * 30 : 0;
  ctx.save();
  ctx.translate(sx, sy);

  if (state.dead) {
    for (const p of state.deathParticles) {
      const a = Math.min(p.life / 70, 1);
      ctx.globalAlpha = a * 0.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.sz * (1 - (1 - a) * 0.5), 0, Math.PI * 2);
      ctx.fillStyle = `hsl(${p.hue},60%,65%)`; ctx.fill();
      ctx.globalAlpha = a * 0.12;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.sz * 2.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    return;
  }

  // Fruit
  if (state.fruit) {
    const lf = state.fruit.life / state.fruitMax;
    const alpha = lf < 0.1 ? lf / 0.1 : 1;
    const fx = state.fruit.x, fy = state.fruit.y;
    const pulse = 0.6 + 0.4 * Math.sin(state.frame * 0.06 + state.fruit.pulse);

    const g2 = ctx.createRadialGradient(fx, fy, 0, fx, fy, 65 + pulse * 12);
    g2.addColorStop(0, `rgba(255,200,80,${alpha * 0.05 * pulse})`);
    g2.addColorStop(0.4, `rgba(255,160,40,${alpha * 0.025})`);
    g2.addColorStop(1, 'rgba(255,120,20,0)');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(fx, fy, 65 + pulse * 12, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = `rgba(255,200,80,${alpha * (lf < 0.2 ? 0.5 : 0.15)})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(fx, fy, 16 + Math.sin(state.frame * 0.08) * 2, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * lf);
    ctx.stroke();

    const cg = ctx.createRadialGradient(fx - 2, fy - 2, 0, fx, fy, 9);
    cg.addColorStop(0, `rgba(255,255,240,${alpha * pulse})`);
    cg.addColorStop(0.2, `rgba(255,230,150,${alpha * 0.95})`);
    cg.addColorStop(0.5, `rgba(255,180,60,${alpha * 0.7})`);
    cg.addColorStop(0.8, `rgba(220,120,30,${alpha * 0.4})`);
    cg.addColorStop(1, `rgba(180,80,20,${alpha * 0.1})`);
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(fx, fy, 7 + pulse * 1.5, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = `rgba(255,255,255,${alpha * 0.5 * pulse})`;
    ctx.beginPath(); ctx.arc(fx - 2, fy - 2.5, 2.2, 0, Math.PI * 2); ctx.fill();
  }

  // Particles
  for (const p of state.particles) {
    const a = Math.min(p.life / 55, 1);
    ctx.globalAlpha = a * 0.6;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.sz * (0.3 + 0.7 * a), 0, Math.PI * 2);
    ctx.fillStyle = `hsl(${p.hue},60%,70%)`; ctx.fill();
    ctx.globalAlpha = a * 0.12;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.sz * 2.5 * a, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Snake body
  for (let i = state.snake.length - 1; i >= 0; i--) {
    const s = state.snake[i], t = i / Math.max(state.snake.length - 1, 1);
    const sz = 5 - t * 2.5;
    if (sz < 0.8) continue;
    const hue = 185 - t * 80, sat = 60 + t * 30, light = 60 - t * 20;

    ctx.beginPath(); ctx.arc(s.x, s.y, sz + 4, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${hue},${sat}%,${light}%,${0.04 + t * 0.05})`; ctx.fill();

    ctx.beginPath(); ctx.arc(s.x, s.y, sz, 0, Math.PI * 2);
    ctx.fillStyle = `hsl(${hue},${sat}%,${light}%)`; ctx.fill();

    ctx.beginPath(); ctx.arc(s.x - sz * 0.2, s.y - sz * 0.25, sz * 0.38, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${0.04 + t * 0.08})`; ctx.fill();
  }

  // Head glow
  const h = state.snake[0];
  const hg = ctx.createRadialGradient(h.x, h.y, 1, h.x, h.y, 22);
  hg.addColorStop(0, 'rgba(80,220,240,0.15)'); hg.addColorStop(0.4, 'rgba(60,180,220,0.06)'); hg.addColorStop(1, 'rgba(40,140,200,0)');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(h.x, h.y, 22, 0, Math.PI * 2); ctx.fill();

  ctx.beginPath(); ctx.arc(h.x, h.y, 5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgb(60,215,235)'; ctx.fill();

  ctx.beginPath(); ctx.arc(h.x - 1.5, h.y - 2, 2.3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fill();

  // Eyes
  const dx = mx - h.x, dy = my - h.y, ed = Math.hypot(dx, dy) || 1, ex = dx / ed, ey = dy / ed;
  ctx.fillStyle = '#0a0a12';
  ctx.beginPath(); ctx.arc(h.x + ex * 2.3 - ey * 1.8, h.y + ey * 2.3 + ex * 1.8, 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(h.x + ex * 2.3 + ey * 1.8, h.y + ey * 2.3 - ex * 1.8, 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(h.x + ex * 2.7 - ey * 1.8, h.y + ey * 2.7 + ex * 1.8, 0.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(h.x + ex * 2.7 + ey * 1.8, h.y + ey * 2.7 - ex * 1.8, 0.6, 0, Math.PI * 2); ctx.fill();

  // Flash
  if (state.flash > 0.01) {
    ctx.fillStyle = `rgba(255,220,150,${state.flash * 0.1})`;
    ctx.fillRect(-10, -10, W + 20, H + 20);
  }

  ctx.restore();
}

// ─── Loop ───
function loop() { pipeline(); draw(); requestAnimationFrame(loop); }
loop();

// ─── Controls ───
function startGame() {
  initSnake();
  state.score = 0; state.dead = false; state.playing = true;
  state.particles = []; state.deathParticles = [];
  state.flash = 0; state.shake = 0; state.frame = 0;
  mx = W / 2; my = H / 2;
  spawnFruit();
  document.getElementById('score').textContent = '0';
  document.getElementById('startOverlay').classList.remove('show');
  document.getElementById('gameOverOverlay').classList.remove('show');
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);
c.addEventListener('click', () => { if (state.dead) startGame(); });

// Hook game over into end of frame
const _p = pipeline;
pipeline = function() {
  _p.call(this);
  if (state.dead) {
    document.getElementById('finalScore').textContent = `score: ${state.score} · length: ${state.snake.length}`;
    document.getElementById('bestScore').textContent = `best: ${state.best}`;
    document.getElementById('gameOverOverlay').classList.add('show');
  }
};
</script>
</body>
</html>
