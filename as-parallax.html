<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>as / not_as</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #fff; font-family: -apple-system, sans-serif; height: 400vh; }
  .scene { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; overflow: hidden; }
  .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; will-change: transform; }
  .l-as { z-index: 1; }
  .l-na { z-index: 2; }
  .dot { position: absolute; border-radius: 50%; }
  .bar { position: absolute; }
  .label { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 10; font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="layer l-as" id="layerAs"></div>
  <div class="layer l-na" id="layerNa"></div>
</div>
<div class="label">as / not_as</div>
<script>
const asLayer = document.getElementById('layerAs');
const naLayer = document.getElementById('layerNa');
const asEls = [];
const naEls = [];

function rand(a, b) { return a + Math.random() * (b - a); }

function randColor(alpha) {
  const hue = Math.random() > 0.5 ? rand(220, 260) : rand(10, 40);
  return `hsla(${hue}, 60%, 60%, ${alpha})`;
}

// as layer — circles, slow, blue
for (let i = 0; i < 40; i++) {
  const el = document.createElement('div');
  el.className = 'dot';
  const size = rand(2, 8);
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  const x = rand(0, 100);
  const y = rand(0, 100);
  const a = rand(0.15, 0.4);
  el.style.left = x + '%';
  el.style.top = y + '%';
  el.style.background = `hsla(${rand(220,250)}, 50%, 65%, ${a})`;
  el.style.opacity = rand(0.2, 0.6);
  asLayer.appendChild(el);
  asEls.push({ el, x, y, depth: rand(0.2, 0.5) });
}

// not_as layer — bars, orange, fast
for (let i = 0; i < 50; i++) {
  const el = document.createElement('div');
  el.className = 'bar';
  const w = rand(1, 3);
  const h = rand(12, 60);
  el.style.width = w + 'px';
  el.style.height = h + 'px';
  const x = rand(0, 100);
  const y = rand(0, 100);
  el.style.left = x + '%';
  el.style.top = y + '%';
  el.style.background = `hsla(${rand(15,35)}, 70%, 55%, ${rand(0.08, 0.25)})`;
  naLayer.appendChild(el);
  naEls.push({ el, x, y, depth: rand(0.6, 1.0) });
}

// extra not_as — dots, smaller, warmer
for (let i = 0; i < 30; i++) {
  const el = document.createElement('div');
  el.className = 'dot';
  const size = rand(1, 4);
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  el.style.left = rand(0, 100) + '%';
  el.style.top = rand(0, 100) + '%';
  el.style.background = `hsla(${rand(340, 360)}, 60%, 70%, ${rand(0.1, 0.3)})`;
  naLayer.appendChild(el);
  naEls.push({ el, x: parseFloat(el.style.left), y: parseFloat(el.style.top), depth: rand(0.7, 1.2) });
}

let ticking = false;

function update() {
  const scrollY = window.scrollY;
  const maxScroll = document.body.scrollHeight - window.innerHeight;
  const progress = Math.min(scrollY / maxScroll, 1);

  asEls.forEach(d => {
    d.el.style.transform = `translateY(${progress * 200 * d.depth}px)`;
  });
  naEls.forEach(d => {
    d.el.style.transform = `translateY(${progress * 400 * d.depth}px)`;
  });

  ticking = false;
}

window.addEventListener('scroll', () => {
  if (!ticking) {
    requestAnimationFrame(update);
    ticking = true;
  }
}, { passive: true });
</script>
</body>
</html>
